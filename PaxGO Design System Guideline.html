  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0px;  --pg-display-md-ls: -0.025em;\n  --pg-display-sm-size: 28px;  --pg-display-sm-lh: 34px;  --pg-display-sm-ls: -0.02em;\n\n  /* Heading — screen + section titles */\n  --pg-heading-lg-size: 22px;  --pg-heading-lg-lh: 28px;  --pg-heading-lg-ls: -0.015em;\n  --pg-heading-md-size: 18px;  --pg-heading-md-lh: 24px;  --pg-heading-md-ls: -0.01em;\n  --pg-heading-sm-size: 16px;  --pg-heading-sm-lh: 22px;  --pg-heading-sm-ls: -0.005em;\n\n  /* Body */\n  --pg-body-lg-size: 16px;  --pg-body-lg-lh: 24px;\n  --pg-body-md-size: 14px;  --pg-body-md-lh: 21px;\n  --pg-body-sm-size: 13px;  --pg-body-sm-lh: 19px;\n\n  /* Support */\n  --pg-label-size: 13px;  --pg-label-lh: 16px;  --pg-label-ls: 0.005em;\n  --pg-caption-size: 12px; --pg-caption-lh: 16px;\n  --pg-overline-size: 11px; --pg-overline-lh: 14px; --pg-overline-ls: 0.08em;\n  --pg-mono-size: 13px;   --pg-mono-lh: 18px;\n\n  /* Semantic aliases */\n  --pg-text-screen-title: var(--pg-fw-bold) var(--pg-heading-lg-size)/var(--pg-heading-lg-lh) var(--pg-font-sans);\n  --pg-text-card-title:   var(--pg-fw-semibold) var(--pg-heading-sm-size)/var(--pg-heading-sm-lh) var(--pg-font-sans);\n  --pg-text-body:         var(--pg-fw-regular) var(--pg-body-md-size)/var(--pg-body-md-lh) var(--pg-font-sans);\n  --pg-text-button:       var(--pg-fw-semibold) var(--pg-body-md-size)/1 var(--pg-font-sans);\n  --pg-text-numeric:      var(--pg-fw-medium) var(--pg-mono-size)/var(--pg-mono-lh) var(--pg-font-mono);\n}\n\n:root {\n  /* 4px base grid; 2px and 6px exist for icon/text optical fixes */\n  --pg-space-0:  0px;\n  --pg-space-1:  2px;\n  --pg-space-2:  4px;\n  --pg-space-3:  6px;\n  --pg-space-4:  8px;\n  --pg-space-5:  12px;\n  --pg-space-6:  16px;\n  --pg-space-7:  20px;\n  --pg-space-8:  24px;\n  --pg-space-9:  32px;\n  --pg-space-10: 40px;\n  --pg-space-11: 48px;\n  --pg-space-12: 64px;\n\n  /* Radii — generous, \"modern & ramah\" */\n  --pg-radius-xs:   6px;\n  --pg-radius-sm:   10px;\n  --pg-radius-md:   14px;\n  --pg-radius-lg:   20px;\n  --pg-radius-xl:   28px;\n  --pg-radius-sheet:24px;\n  --pg-radius-pill: 999px;\n\n  /* Layout */\n  --pg-screen-gutter: 20px;        /* mobile safe horizontal padding */\n  --pg-admin-gutter:  24px;\n  --pg-sidebar-w:     248px;\n  --pg-sidebar-w-collapsed: 68px;\n  --pg-topbar-h:      64px;\n  --pg-tabbar-h:      64px;\n  --pg-appbar-h:      56px;\n  --pg-touch-min:     48px;        /* Android minimum hit target */\n  --pg-content-max:   1440px;\n\n  --pg-border-w:      1px;\n  --pg-border-w-thick:2px;\n}\n\n:root {\n  /* Soft, blue-tinted shadows. Never pure black. */\n  --pg-shadow-none: none;\n  --pg-shadow-xs: 0 1px 2px rgba(7, 8, 8, 0.06);\n  --pg-shadow-sm: 0 1px 2px rgba(7, 8, 8, 0.05), 0 2px 6px rgba(7, 8, 8, 0.06);\n  --pg-shadow-md: 0 2px 4px rgba(7, 8, 8, 0.05), 0 8px 20px rgba(7, 8, 8, 0.09);\n  --pg-shadow-lg: 0 4px 8px rgba(7, 8, 8, 0.06), 0 16px 40px rgba(7, 8, 8, 0.13);\n  --pg-shadow-sheet: 0 -8px 32px rgba(7, 8, 8, 0.15);\n  --pg-shadow-brand: 0 6px 16px rgba(48, 92, 222, 0.28);\n  --pg-shadow-accent: 0 6px 16px rgba(255, 111, 0, 0.30);\n  --pg-shadow-inner: inset 0 1px 2px rgba(7, 8, 8, 0.07);\n\n  --pg-blur-glass: saturate(150%) blur(14px);\n  --pg-glass-bg: rgba(255, 255, 255, 0.72);\n\n  --pg-z-base: 0;\n  --pg-z-sticky: 10;\n  --pg-z-appbar: 20;\n  --pg-z-sheet: 40;\n  --pg-z-modal: 50;\n  --pg-z-toast: 60;\n}\n\n[data-theme=\"dark\"] {\n  --pg-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --pg-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 6px rgba(0, 0, 0, 0.32);\n  --pg-shadow-md: 0 2px 4px rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.44);\n  --pg-shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.44), 0 16px 40px rgba(0, 0, 0, 0.56);\n  --pg-shadow-sheet: 0 -8px 32px rgba(0, 0, 0, 0.6);\n  --pg-glass-bg: rgba(20, 22, 26, 0.78);\n}\n\n:root {\n  --pg-dur-instant: 80ms;\n  --pg-dur-fast:    140ms;\n  --pg-dur-normal:  220ms;\n  --pg-dur-slow:    320ms;\n  --pg-dur-sheet:   360ms;\n\n  --pg-ease-standard: cubic-bezier(0.2, 0, 0, 1);      /* default: quick out, soft land */\n  --pg-ease-out:      cubic-bezier(0.16, 1, 0.3, 1);   /* entrances, sheets */\n  --pg-ease-in:       cubic-bezier(0.4, 0, 1, 1);       /* exits */\n  --pg-ease-spring:   cubic-bezier(0.34, 1.4, 0.64, 1); /* success ticks, pin drops only */\n\n  --pg-press-scale: 0.975;\n  --pg-transition-ui: color var(--pg-dur-fast) var(--pg-ease-standard),\n                      background-color var(--pg-dur-fast) var(--pg-ease-standard),\n                      border-color var(--pg-dur-fast) var(--pg-ease-standard),\n                      box-shadow var(--pg-dur-fast) var(--pg-ease-standard),\n                      transform var(--pg-dur-fast) var(--pg-ease-standard);\n}\n\n@keyframes pg-pulse-ring {\n  0%   { transform: scale(0.7); opacity: 0.55; }\n  100% { transform: scale(2.4); opacity: 0; }\n}\n@keyframes pg-shimmer {\n  0%   { background-position: -200% 0; }\n  100% { background-position: 200% 0; }\n}\n@keyframes pg-sheet-in {\n  from { transform: translateY(100%); }\n  to   { transform: translateY(0); }\n}\n@keyframes pg-fade-up {\n  from { opacity: 0; transform: translateY(8px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes pg-spin { to { transform: rotate(360deg); } }\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--pg-bg-app);\n  color: var(--pg-text-primary);\n  font: var(--pg-text-body);\n  font-family: var(--pg-font-sans);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  text-wrap: pretty;\n}\n\na { color: var(--pg-text-link); text-decoration: none; }\na:hover { color: var(--pg-text-link-hover); text-decoration: underline; }\n\nbutton, input, select, textarea { font: inherit; font-family: var(--pg-font-sans); }\n\n:focus-visible { outline: none; box-shadow: var(--pg-focus-ring); border-radius: var(--pg-radius-xs); }\n\n.pg-tnum { font-variant-numeric: tabular-nums; }\n.pg-mono { font-family: var(--pg-font-mono); }\n\n::selection { background: var(--pg-brand-100); color: var(--pg-brand-900); }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }\n}\n\n<\u002Fstyle>\n<script src=\"6c03adb6-909e-4d61-a24e-94aa9562a52f\"><\u002Fscript>\n<style>\n  body { background: var(--pg-bg-app); }\n  .page { max-width: 1080px; margin: 0 auto; padding: 0 24px 96px; }\n  .doc { display: flex; flex-direction: column; gap: 48px; }\n\n  h1 { font: 800 clamp(34px, 5vw, 46px)/1.05 var(--pg-font-sans); letter-spacing: -.035em; margin: 0; }\n  h2 { font: 700 clamp(24px, 3vw, 30px)/1.15 var(--pg-font-sans); letter-spacing: -.022em; margin: 0 0 6px; }\n  h3 { font: 700 18px/1.3 var(--pg-font-sans); letter-spacing: -.01em; margin: 0 0 10px; }\n  h4 { font: 600 14px/1.35 var(--pg-font-sans); margin: 0 0 8px; }\n  p  { font: 400 15px/1.65 var(--pg-font-sans); color: var(--pg-text-secondary); margin: 0; max-width: 68ch; }\n  li { font: 400 14px/1.7 var(--pg-font-sans); color: var(--pg-text-secondary); }\n  ul, ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }\n  strong { color: var(--pg-text-primary); font-weight: 600; }\n  code, .m { font-family: var(--pg-font-mono); font-size: .88em; color: var(--pg-text-primary);\n             background: var(--pg-bg-sunken); padding: 2px 5px; border-radius: 5px; }\n  a { color: var(--pg-text-link); } a:hover { color: var(--pg-text-link-hover); }\n\n  .eyebrow { font: 700 var(--pg-overline-size)/1 var(--pg-font-sans); letter-spacing: var(--pg-overline-ls);\n             text-transform: uppercase; color: var(--pg-text-tertiary); }\n  .lead { font: 400 17px/1.6 var(--pg-font-sans); color: var(--pg-text-secondary); max-width: 62ch; }\n\n  section > header { border-top: 2px solid var(--pg-n-900); padding-top: 14px; margin-bottom: 22px; }\n  .sub { display: flex; flex-direction: column; gap: 16px; margin-top: 30px; }\n\n  .card { background: var(--pg-bg-surface); border: 1px solid var(--pg-border-subtle);\n          border-radius: var(--pg-radius-lg); box-shadow: var(--pg-shadow-sm); padding: 20px; }\n  .inset { background: var(--pg-bg-inset); border: 1px solid var(--pg-border-subtle);\n           border-radius: var(--pg-radius-md); padding: 14px; }\n  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }\n  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }\n  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }\n\n  table { width: 100%; border-collapse: collapse; }\n  th { text-align: left; font: 600 12px/1 var(--pg-font-sans); color: var(--pg-text-secondary);\n       padding: 10px 12px; background: var(--pg-bg-inset); border-bottom: 1px solid var(--pg-border-subtle); white-space: nowrap; }\n  td { font: 400 13px/1.5 var(--pg-font-sans); color: var(--pg-text-primary);\n       padding: 10px 12px; border-bottom: 1px solid var(--pg-border-subtle); vertical-align: top; }\n  td.m, th.m { font-family: var(--pg-font-mono); font-size: 12px; background: none; }\n  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }\n  .tw { overflow-x: auto; border: 1px solid var(--pg-border-subtle); border-radius: var(--pg-radius-md); background: var(--pg-bg-surface); }\n\n  .ramp { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 6px; }\n  .ramp div span { display: block; height: 52px; border-radius: var(--pg-radius-xs); border: 1px solid rgba(7,8,8,.07); }\n  .ramp div b { display: block; font: 600 11px/1.4 var(--pg-font-mono); margin-top: 5px; color: var(--pg-text-primary); }\n  .ramp div i { display: block; font: 400 10px/1.3 var(--pg-font-mono); color: var(--pg-text-tertiary); font-style: normal; }\n\n  .do, .dont { border-radius: var(--pg-radius-md); padding: 16px; border: 1px solid; }\n  .do { background: var(--pg-success-50); border-color: var(--pg-success-100); }\n  .dont { background: var(--pg-danger-50); border-color: var(--pg-danger-100); }\n  .do h4, .dont h4 { color: var(--pg-text-primary); display: flex; align-items: center; gap: 7px; }\n\n  /* live button specimens */\n  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;\n         height: 44px; padding: 0 16px; border-radius: var(--pg-radius-md);\n         font: var(--pg-text-button); border: 1px solid transparent; cursor: pointer;\n         transition: var(--pg-transition-ui); white-space: nowrap; }\n  .btn:active { transform: scale(var(--pg-press-scale)); }\n  .btn-primary { background: var(--pg-action-primary); color: var(--pg-action-primary-text); box-shadow: var(--pg-shadow-xs); }\n  .btn-primary:hover { background: var(--pg-action-primary-hover); }\n  .btn-primary:active { background: var(--pg-action-primary-press); }\n  .btn-secondary { background: var(--pg-action-secondary); color: var(--pg-text-primary); border-color: var(--pg-border-default); }\n  .btn-secondary:hover { background: var(--pg-action-secondary-hover); }\n  .btn-ghost { background: transparent; color: var(--pg-text-brand); }\n  .btn-ghost:hover { background: var(--pg-action-ghost-hover); }\n  .btn-accent { background: var(--pg-action-accent); color: var(--pg-action-accent-text); box-shadow: var(--pg-shadow-xs); }\n  .btn-accent:hover { background: var(--pg-action-accent-hover); }\n  .btn-danger { background: var(--pg-action-danger); color: #fff; }\n  .btn-danger:hover { background: var(--pg-danger-700); }\n  .btn-sm { height: 36px; padding: 0 12px; font: 600 13px/1 var(--pg-font-sans); }\n  .btn-lg { height: 52px; padding: 0 20px; font: 600 15px/1 var(--pg-font-sans); }\n  .btn[disabled] { background: var(--pg-action-disabled); color: var(--pg-text-disabled);\n                   border-color: transparent; box-shadow: none; cursor: not-allowed; transform: none; }\n  .btn.is-focus { box-shadow: var(--pg-focus-ring); }\n  .spin { width: 18px; height: 18px; border-radius: 99px; border: 2px solid currentColor;\n          border-top-color: transparent; animation: pg-spin 700ms linear infinite; }\n\n  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;\n          font: 600 13px/1 var(--pg-font-sans); }\n  .pill i { width: 7px; height: 7px; border-radius: 99px; background: currentColor; }\n\n  .swatchbig { border-radius: var(--pg-radius-md); padding: 16px; min-height: 128px;\n               display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; }\n  .swatchbig b { font: 700 16px/1.2 var(--pg-font-sans); }\n  .swatchbig span { font: 500 12px/1.5 var(--pg-font-mono); opacity: .85; }\n\n  .spec { border-left: 2px solid var(--pg-border-subtle); padding-left: 14px; }\n  .anno { font: 400 12px/1.5 var(--pg-font-mono); color: var(--pg-text-tertiary); }\n\n  .toc { position: sticky; top: 0; background: var(--pg-glass-bg); backdrop-filter: var(--pg-blur-glass);\n         border-bottom: 1px solid var(--pg-border-subtle); z-index: 10; margin-bottom: 40px; }\n  .toc nav { max-width: 1080px; margin: 0 auto; padding: 12px 24px; display: flex; gap: 6px; overflow-x: auto; }\n  .toc a { flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; font: 500 13px/1 var(--pg-font-sans);\n           color: var(--pg-text-secondary); text-decoration: none; }\n  .toc a:hover { background: var(--pg-bg-sunken); color: var(--pg-text-primary); text-decoration: none; }\n\n  .ok { color: var(--pg-text-success); font-weight: 600; }\n  .bad { color: var(--pg-text-danger); font-weight: 600; }\n  .warn { color: var(--pg-text-warning); font-weight: 600; }\n\n  @media print {\n    .toc { display: none; }\n    body { background: #fff; }\n    section { break-inside: avoid; }\n  }\n<\u002Fstyle>\n\n<\u002Fhead><body>\n\n<div class=\"toc\"><nav>\n  <a href=\"#fondasi\">Fondasi<\u002Fa><a href=\"#warna\">Warna<\u002Fa><a href=\"#status\">Status<\u002Fa>\n  <a href=\"#tipografi\">Tipografi<\u002Fa><a href=\"#copy\">Copywriting<\u002Fa><a href=\"#spasi\">Spasi &amp; grid<\u002Fa>\n  <a href=\"#radius\">Radius &amp; elevasi<\u002Fa><a href=\"#button\">Button<\u002Fa><a href=\"#form\">Form<\u002Fa>\n  <a href=\"#ikon\">Ikonografi<\u002Fa><a href=\"#motion\">Motion<\u002Fa><a href=\"#akses\">Aksesibilitas<\u002Fa>\n  <a href=\"#token\">Token<\u002Fa>\n<\u002Fnav><\u002Fdiv>\n\n<div class=\"page\"><div class=\"doc\">\n\n<header style=\"padding-top:12px\">\n  <div class=\"eyebrow\" style=\"margin-bottom:14px\">PaxGO Design System · Guideline v1.1 · 13 September 2026<\u002Fdiv>\n  <h1>Pax<span style=\"color:var(--pg-brand-500)\">GO<\u002Fspan> Design System<\u002Fh1>\n  <p class=\"lead\" style=\"margin-top:14px\">\n    Dokumen acuan tunggal untuk warna, tipografi, dan komponen aksi di tiga permukaan PaxGO:\n    aplikasi Customer (Android), aplikasi Driver (Android), dan Admin Backoffice (web).\n    Setiap angka di sini adalah nilai yang benar-benar dipakai di kode — bukan ilustrasi.\n  <\u002Fp>\n  <div class=\"grid3\" style=\"margin-top:26px\">\n    <div class=\"inset\"><div class=\"eyebrow\">Sumber warna<\u002Fdiv><p style=\"font-size:13px;margin-top:6px\">Fill artwork <span class=\"m\">PAXGO Car Sticker.pdf<\u002Fspan> (Adobe Illustrator), dibaca langsung dari content stream PDF.<\u002Fp><\u002Fdiv>\n    <div class=\"inset\"><div class=\"eyebrow\">Sumber fungsi<\u002Fdiv><p style=\"font-size:13px;margin-top:6px\">Penawaran No. 004/VIII/2026 — state machine order, matching driver, geofencing, 18 modul admin.<\u002Fp><\u002Fdiv>\n    <div class=\"inset\"><div class=\"eyebrow\">Status<\u002Fdiv><p style=\"font-size:13px;margin-top:6px\">Logo dan font brand <strong>belum diberikan<\u002Fstrong>. Wordmark dirender sebagai tipografi; ikon memakai Lucide. Keduanya substitusi.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"fondasi\">\n  <header><div class=\"eyebrow\">01<\u002Fdiv><h2>Fondasi &amp; cara pakai<\u002Fh2><\u002Fheader>\n  <p>Sistem ini berdiri di atas satu prinsip: <strong>alat kerja yang tidak terasa industrial<\u002Fstrong>. Radius besar dan shadow lembut membuatnya ramah; satu biru jenuh yang memegang semua aksi membuatnya tetap tegas. Kepadatan berbeda per permukaan — longgar di mobile, padat di admin — tapi tokennya sama.<\u002Fp>\n\n  <div class=\"sub\">\n    <h3>Tiga aturan yang tidak bisa dinegosiasikan<\u002Fh3>\n    <div class=\"grid3\">\n      <div class=\"card\"><h4>1 · Token, bukan hex<\u002Fh4><p style=\"font-size:13px\">Setiap warna, ukuran, dan durasi diambil dari custom property <span class=\"m\">--pg-*<\u002Fspan>. Kalau warna yang dibutuhkan belum ada tokennya, <em>buat tokennya<\u002Fem> — jangan tulis hex di komponen.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><h4>2 · Satu aksi primer<\u002Fh4><p style=\"font-size:13px\">Satu layar = satu tombol biru. Aksi lain memakai secondary (netral berbingkai) atau ghost. Kalau dua tombol biru bersaing, salah satunya salah.<\u002Fp><\u002Fdiv>\n      <div class=\"card\"><h4>3 · Status punya kosakata tetap<\u002Fh4><p style=\"font-size:13px\">Warna status order sudah dikunci dan berlaku identik di customer, driver, dan admin. Tidak pernah dibuat baru, tidak pernah diganti.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:14px\">Penamaan token<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th>Pola<\u002Fth><th>Arti<\u002Fth><th>Contoh<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td class=\"m\">--pg-&lt;skala&gt;-&lt;langkah&gt;<\u002Ftd><td>Warna mentah dalam ramp. Angka besar = lebih gelap.<\u002Ftd><td class=\"m\">--pg-brand-500<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-&lt;peran&gt;-&lt;varian&gt;<\u002Ftd><td>Alias semantik. <strong>Inilah yang dipakai komponen<\u002Fstrong>, bukan ramp mentah.<\u002Ftd><td class=\"m\">--pg-text-secondary<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-action-*<\u002Ftd><td>Warna kontrol interaktif, termasuk state hover/press/disabled.<\u002Ftd><td class=\"m\">--pg-action-primary-hover<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-state-&lt;order&gt;-&lt;bg|fg&gt;<\u002Ftd><td>Kosakata status order. Enam warna untuk dua belas state.<\u002Ftd><td class=\"m\">--pg-state-transit-fg<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-space-1 … 12<\u002Ftd><td>Grid 4px. Angka indeks, bukan piksel.<\u002Ftd><td class=\"m\">--pg-space-6 = 16px<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n    <p style=\"margin-top:12px\">Dark mode adalah tema penuh, bukan inversi. Semua alias semantik ditimpa di dalam <span class=\"m\">[data-theme=\"dark\"]<\u002Fspan>; komponen tidak perlu tahu tema apa yang aktif.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"warna\">\n  <header><div class=\"eyebrow\">02<\u002Fdiv><h2>Warna<\u002Fh2><\u002Fheader>\n  <p>Dua warna brand, diambil dari fill artwork sticker kendaraan. <strong>Biru memerintah, oranye bergerak.<\u002Fstrong> Netral sengaja hampir tanpa chroma supaya warna status selalu menang di mata.<\u002Fp>\n\n  <div class=\"grid2\" style=\"margin-top:22px\">\n    <div class=\"swatchbig\" style=\"background:var(--pg-brand-500);color:#fff\">\n      <b>Primary · PaxGO Blue<\u002Fb>\n      <span>#305CDE · --pg-brand-500<\u002Fspan>\n      <span>9 fill di artwork sticker<\u002Fspan>\n      <span>Aksi primer, nav aktif, state terpilih, garis rute<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"swatchbig\" style=\"background:var(--pg-accent-500);color:var(--pg-n-950)\">\n      <b>Secondary · PaxGO Orange<\u002Fb>\n      <span>#FF6F00 · --pg-accent-500<\u002Fspan>\n      <span>7 fill di artwork sticker<\u002Fspan>\n      <span>Gerak &amp; urgensi: titik driver, in-transit, countdown tawaran<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Ramp primary<\u002Fh3>\n    <div class=\"ramp\">\n      <div><span style=\"background:var(--pg-brand-50)\"><\u002Fspan><b>brand-50<\u002Fb><i>#EDF1FD<\u002Fi><i style=\"color:var(--pg-text-secondary)\">latar pill, hover ghost<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-100)\"><\u002Fspan><b>brand-100<\u002Fb><i>#DBE3FB<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-200)\"><\u002Fspan><b>brand-200<\u002Fb><i>#B7C6F7<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-300)\"><\u002Fspan><b>brand-300<\u002Fb><i>#8BA5F0<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks brand di dark<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-400)\"><\u002Fspan><b>brand-400<\u002Fb><i>#5B7FE8<\u002Fi><i style=\"color:var(--pg-text-secondary)\">hover primer di dark<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-500)\"><\u002Fspan><b>brand-500<\u002Fb><i>#305CDE<\u002Fi><i style=\"color:var(--pg-text-secondary)\">fill aksi<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-600)\"><\u002Fspan><b>brand-600<\u002Fb><i>#2449BC<\u002Fi><i style=\"color:var(--pg-text-secondary)\">hover, teks brand<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-700)\"><\u002Fspan><b>brand-700<\u002Fb><i>#1B3A97<\u002Fi><i style=\"color:var(--pg-text-secondary)\">press, teks pill<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-800)\"><\u002Fspan><b>brand-800<\u002Fb><i>#152E76<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-brand-900)\"><\u002Fspan><b>brand-900<\u002Fb><i>#11265E<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks di ::selection<\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:20px\">Ramp secondary<\u002Fh3>\n    <div class=\"ramp\">\n      <div><span style=\"background:var(--pg-accent-50)\"><\u002Fspan><b>accent-50<\u002Fb><i>#FFF2E6<\u002Fi><i style=\"color:var(--pg-text-secondary)\">latar pill in-transit<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-100)\"><\u002Fspan><b>accent-100<\u002Fb><i>#FFE1C7<\u002Fi><i style=\"color:var(--pg-text-secondary)\">jalan minor di peta<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-200)\"><\u002Fspan><b>accent-200<\u002Fb><i>#FFC28E<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-300)\"><\u002Fspan><b>accent-300<\u002Fb><i>#FFA254<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks accent di dark<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-400)\"><\u002Fspan><b>accent-400<\u002Fb><i>#FF8722<\u002Fi><i style=\"color:var(--pg-text-secondary)\">hover tombol accent<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-500)\"><\u002Fspan><b>accent-500<\u002Fb><i>#FF6F00<\u002Fi><i style=\"color:var(--pg-text-secondary)\">fill accent, titik driver<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-600)\"><\u002Fspan><b>accent-600<\u002Fb><i>#D95E00<\u002Fi><i style=\"color:var(--pg-text-secondary)\">hanya garis/ikon<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-accent-700)\"><\u002Fspan><b>accent-700<\u002Fb><i>#A84900<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks pill in-transit<\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"inset\" style=\"margin-top:14px\">\n      <p style=\"font-size:13px\"><strong>Oranye adalah fill terang.<\u002Fstrong> Ia membawa tinta gelap (<span class=\"m\">--pg-n-950<\u002Fspan>, 7,19:1) dan <em>menjadi lebih terang<\u002Fem> saat hover — bukan lebih gelap. Baik teks putih di atas <span class=\"m\">#FF6F00<\u002Fspan> (2,79:1) maupun teks apa pun di atas <span class=\"m\">accent-600<\u002Fspan> tidak lolos 4,5:1. Ini pengecualian yang disengaja dan sudah dikunci di token.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:20px\">Netral<\u002Fh3>\n    <p style=\"margin-bottom:12px\">Di-anchor pada dua warna sticker: <span class=\"m\">#F3F3F3<\u002Fspan> sebagai latar aplikasi dan <span class=\"m\">#070808<\u002Fspan> sebagai tinta. Latar halaman <strong>bukan putih<\u002Fstrong> — yang mengapung adalah kartunya, bukan halamannya.<\u002Fp>\n    <div class=\"ramp\">\n      <div><span style=\"background:var(--pg-n-0)\"><\u002Fspan><b>n-0<\u002Fb><i>#FFFFFF<\u002Fi><i style=\"color:var(--pg-text-secondary)\">surface kartu<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-25)\"><\u002Fspan><b>n-25<\u002Fb><i>#FAFAFB<\u002Fi><i style=\"color:var(--pg-text-secondary)\">panel inset<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-50)\"><\u002Fspan><b>n-50<\u002Fb><i>#F3F3F3<\u002Fi><i style=\"color:var(--pg-text-secondary)\">latar aplikasi<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-100)\"><\u002Fspan><b>n-100<\u002Fb><i>#E9EAEC<\u002Fi><i style=\"color:var(--pg-text-secondary)\">sunken, track bar<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-200)\"><\u002Fspan><b>n-200<\u002Fb><i>#DCDDE1<\u002Fi><i style=\"color:var(--pg-text-secondary)\">border subtle<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-300)\"><\u002Fspan><b>n-300<\u002Fb><i>#C3C5CB<\u002Fi><i style=\"color:var(--pg-text-secondary)\">border default<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-400)\"><\u002Fspan><b>n-400<\u002Fb><i>#9A9DA6<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks nonaktif<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-500)\"><\u002Fspan><b>n-500<\u002Fb><i>#73777F<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks tersier<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-600)\"><\u002Fspan><b>n-600<\u002Fb><i>#545860<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks sekunder<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-700)\"><\u002Fspan><b>n-700<\u002Fb><i>#3C4046<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-800)\"><\u002Fspan><b>n-800<\u002Fb><i>#272A2F<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-900)\"><\u002Fspan><b>n-900<\u002Fb><i>#16181B<\u002Fi><\u002Fdiv>\n      <div><span style=\"background:var(--pg-n-950)\"><\u002Fspan><b>n-950<\u002Fb><i>#070808<\u002Fi><i style=\"color:var(--pg-text-secondary)\">teks utama<\u002Fi><\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:20px\">Semantik<\u002Fh3>\n    <p style=\"margin-bottom:12px\">Hue-nya pun dari sticker. Pola tiap skala sama: <span class=\"m\">-50<\u002Fspan> untuk latar, <span class=\"m\">-500<\u002Fspan> untuk fill/ikon, <span class=\"m\">-700<\u002Fspan> untuk teks di atas latar 50.<\u002Fp>\n    <div class=\"grid3\">\n      <div class=\"card\">\n        <h4 style=\"color:var(--pg-text-success)\">Success · #00BD4F<\u002Fh4>\n        <div class=\"row\" style=\"gap:6px;margin:10px 0\">\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-success-50);border:1px solid var(--pg-success-100)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-success-100)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-success-500)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-success-700)\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12px\">Terkirim, dokumen terverifikasi, saldo masuk. Teks putih di atas 500 hanya 2,50:1 — jangan.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4 style=\"color:var(--pg-text-warning)\">Warning · #FFC107<\u002Fh4>\n        <div class=\"row\" style=\"gap:6px;margin:10px 0\">\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-warning-50);border:1px solid var(--pg-warning-100)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-warning-100)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-warning-500)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-warning-700)\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12px\">Mencari driver, SLA menipis, dokumen kedaluwarsa. Selalu tinta gelap di atas 500 (12,30:1).<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4 style=\"color:var(--pg-text-danger)\">Danger · #F33121<\u002Fh4>\n        <div class=\"row\" style=\"gap:6px;margin:10px 0\">\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-danger-50);border:1px solid var(--pg-danger-100)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-danger-500)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-danger-600)\"><\u002Fspan>\n          <span style=\"width:38px;height:38px;border-radius:8px;background:var(--pg-danger-700)\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:12px\">Gagal kirim, dibatalkan, dispute, force cancel. <strong>Fill tombol memakai 600<\u002Fstrong>, bukan 500 — lihat Aksesibilitas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:20px\">Warna yang tersisa dari artwork<\u002Fh3>\n    <div class=\"inset\">\n      <div class=\"row\">\n        <span style=\"width:44px;height:44px;border-radius:10px;background:var(--pg-sky-500)\"><\u002Fspan>\n        <p style=\"font-size:13px;flex:1;min-width:220px\"><span class=\"m\">#2185FF<\u002Fspan> disimpan sebagai <span class=\"m\">--pg-sky-500<\u002Fspan> dan hanya boleh menjadi <strong>tint informasi<\u002Fstrong> — bukan tombol, bukan status, bukan nav aktif. Ia terlalu dekat dengan biru brand untuk dipakai sebagai aksi.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:20px\">Tema gelap<\u002Fh3>\n    <p style=\"margin-bottom:12px\">Surface naik dari latar, bukan sebaliknya. Fill brand tetap <span class=\"m\">#305CDE<\u002Fspan>; yang berubah adalah <em>teks<\u002Fem> brand menjadi <span class=\"m\">--pg-brand-300<\u002Fspan>.<\u002Fp>\n    <div class=\"grid2\">\n      <div style=\"padding:16px;border-radius:var(--pg-radius-lg);background:#F3F3F3;border:1px solid #DCDDE1\">\n        <div class=\"eyebrow\">Light<\u002Fdiv>\n        <div style=\"margin-top:10px;padding:14px;border-radius:var(--pg-radius-md);background:#fff;border:1px solid #DCDDE1;box-shadow:0 1px 2px rgba(7,8,8,.05)\">\n          <div style=\"font:700 15px/1.3 var(--pg-font-sans);color:#070808\">Kartu di atas latar aplikasi<\u002Fdiv>\n          <div style=\"font:400 12px/1.6 var(--pg-font-mono);color:#545860;margin-top:6px\">app #F3F3F3 · surface #FFFFFF<br>border #DCDDE1 · teks #070808<\u002Fdiv>\n          <span class=\"pill\" style=\"background:#EDF1FD;color:#1B3A97;margin-top:10px\"><i><\u002Fi>Driver ditemukan<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px;border-radius:var(--pg-radius-lg);background:#070808;border:1px solid #24272C\">\n        <div class=\"eyebrow\" style=\"color:#82868E\">Dark<\u002Fdiv>\n        <div style=\"margin-top:10px;padding:14px;border-radius:var(--pg-radius-md);background:#14161A;border:1px solid #24272C\">\n          <div style=\"font:700 15px/1.3 var(--pg-font-sans);color:#F4F5F6\">Kartu di atas latar aplikasi<\u002Fdiv>\n          <div style=\"font:400 12px/1.6 var(--pg-font-mono);color:#ADB1B8;margin-top:6px\">app #070808 · surface #14161A<br>border #24272C · teks #F4F5F6<\u002Fdiv>\n          <span class=\"pill\" style=\"background:rgba(48,92,222,.20);color:#9DB4FF;margin-top:10px\"><i><\u002Fi>Driver ditemukan<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid2\" style=\"margin-top:22px\">\n      <div class=\"do\">\n        <h4>Lakukan<\u002Fh4>\n        <ul>\n          <li>Pakai alias semantik (<span class=\"m\">--pg-text-secondary<\u002Fspan>), bukan ramp mentah, di dalam komponen.<\u002Fli>\n          <li>Beri oranye peran gerak: titik driver, in-transit, countdown.<\u002Fli>\n          <li>Kombinasikan tint 50 + shade 700 untuk semua pill.<\u002Fli>\n          <li>Biarkan netral tetap sunyi supaya status terlihat.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dont\">\n        <h4>Hindari<\u002Fh4>\n        <ul>\n          <li>Oranye sebagai tombol umum, header, atau dekorasi.<\u002Fli>\n          <li>Gradient sebagai latar halaman atau kartu (hanya scrim peta/foto dan shimmer skeleton).<\u002Fli>\n          <li>Dua biru berbeda di satu layar.<\u002Fli>\n          <li>Teks putih di atas success-500, warning-500, atau accent-500.<\u002Fli>\n          <li><span class=\"m\">#2185FF<\u002Fspan> sebagai warna aksi.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"status\">\n  <header><div class=\"eyebrow\">03<\u002Fdiv><h2>Kosakata status order<\u002Fh2><\u002Fheader>\n  <p>Ini bagian paling penting dari sistem warna. Dispatcher, driver, dan customer melihat layar berbeda — mereka harus membaca <strong>warna yang sama dengan arti yang sama<\u002Fstrong>. Dua belas state dari state machine dipetakan ke enam warna.<\u002Fp>\n\n  <div class=\"row\" style=\"margin:20px 0\">\n    <span class=\"pill\" style=\"background:var(--pg-state-draft-bg);color:var(--pg-state-draft-fg)\"><i><\u002Fi>Draft<\u002Fspan><span class=\"pill\" style=\"background:var(--pg-state-searching-bg);color:var(--pg-state-searching-fg)\"><i><\u002Fi>Mencari driver<\u002Fspan><span class=\"pill\" style=\"background:var(--pg-state-assigned-bg);color:var(--pg-state-assigned-fg)\"><i><\u002Fi>Driver ditemukan<\u002Fspan><span class=\"pill\" style=\"background:var(--pg-state-transit-bg);color:var(--pg-state-transit-fg)\"><i><\u002Fi>Dalam perjalanan<\u002Fspan><span class=\"pill\" style=\"background:var(--pg-state-delivered-bg);color:var(--pg-state-delivered-fg)\"><i><\u002Fi>Terkirim<\u002Fspan><span class=\"pill\" style=\"background:var(--pg-state-failed-bg);color:var(--pg-state-failed-fg)\"><i><\u002Fi>Gagal kirim<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"tw\"><table>\n    <thead><tr><th>Warna<\u002Fth><th>Label UI (ID)<\u002Fth><th>State di API<\u002Fth><th>Arti operasional<\u002Fth><th class=\"m\">Token<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-draft-bg);color:var(--pg-state-draft-fg)\"><i><\u002Fi>Grey<\u002Fspan><\u002Ftd>\n        <td><strong>Draft<\u002Fstrong><\u002Ftd><td class=\"m\">Draft<\u002Ftd><td>Order dibuat tapi belum dikirim ke matching<\u002Ftd>\n        <td class=\"m\">--pg-state-draft-bg / -fg<\u002Ftd><\u002Ftr><tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-searching-bg);color:var(--pg-state-searching-fg)\"><i><\u002Fi>Amber<\u002Fspan><\u002Ftd>\n        <td><strong>Mencari driver<\u002Fstrong><\u002Ftd><td class=\"m\">Searching<\u002Ftd><td>Radius bertahap 1,5 km → +1,5 km / 45 detik<\u002Ftd>\n        <td class=\"m\">--pg-state-searching-bg / -fg<\u002Ftd><\u002Ftr><tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-assigned-bg);color:var(--pg-state-assigned-fg)\"><i><\u002Fi>Biru<\u002Fspan><\u002Ftd>\n        <td><strong>Driver ditemukan<\u002Fstrong><\u002Ftd><td class=\"m\">Assigned · to_pickup · at_pickup<\u002Ftd><td>Driver menerima, menuju, dan tiba di pickup<\u002Ftd>\n        <td class=\"m\">--pg-state-assigned-bg / -fg<\u002Ftd><\u002Ftr><tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-transit-bg);color:var(--pg-state-transit-fg)\"><i><\u002Fi>Oranye<\u002Fspan><\u002Ftd>\n        <td><strong>Dalam perjalanan<\u002Fstrong><\u002Ftd><td class=\"m\">Picked_up · in_transit · arrived<\u002Ftd><td>Barang di tangan driver sampai tiba di tujuan<\u002Ftd>\n        <td class=\"m\">--pg-state-transit-bg / -fg<\u002Ftd><\u002Ftr><tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-delivered-bg);color:var(--pg-state-delivered-fg)\"><i><\u002Fi>Hijau<\u002Fspan><\u002Ftd>\n        <td><strong>Terkirim<\u002Fstrong><\u002Ftd><td class=\"m\">Delivered<\u002Ftd><td>POD lengkap dan terverifikasi<\u002Ftd>\n        <td class=\"m\">--pg-state-delivered-bg / -fg<\u002Ftd><\u002Ftr><tr>\n        <td><span class=\"pill\" style=\"background:var(--pg-state-failed-bg);color:var(--pg-state-failed-fg)\"><i><\u002Fi>Merah<\u002Fspan><\u002Ftd>\n        <td><strong>Gagal kirim<\u002Fstrong><\u002Ftd><td class=\"m\">Cancelled · failed · disputed<\u002Ftd><td>Semua akhir yang tidak berhasil<\u002Ftd>\n        <td class=\"m\">--pg-state-failed-bg / -fg<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable><\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Aturan penggunaan<\u002Fh3>\n    <ul>\n      <li>Status <strong>selalu<\u002Fstrong> berupa pill, bukan teks berwarna telanjang dan bukan ikon sendirian.<\u002Fli>\n      <li>Pill punya dot 7px agar tetap terbaca oleh pengguna dengan defisiensi warna — warna bukan satu-satunya pembawa informasi.<\u002Fli>\n      <li>Di tabel admin, sel status memakai pill ukuran <span class=\"m\">sm<\u002Fspan>; jangan diganti badge atau teks.<\u002Fli>\n      <li>Timeline order memakai token yang sama, sehingga pill dan timeline tidak pernah berbeda warna untuk state yang sama.<\u002Fli>\n      <li>Tidak ada status baru tanpa menambah token. Status buatan sendiri di komponen = bug.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"tipografi\">\n  <header><div class=\"eyebrow\">04<\u002Fdiv><h2>Tipografi<\u002Fh2><\u002Fheader>\n  <p>Dua keluarga huruf, pembagian tugas yang tegas: sans untuk semua yang dibaca sebagai kalimat, mono untuk semua yang dibaca <em>karakter per karakter<\u002Fem>.<\u002Fp>\n\n  <div class=\"grid2\" style=\"margin-top:22px\">\n    <div class=\"card\">\n      <div class=\"eyebrow\">UI &amp; display<\u002Fdiv>\n      <div style=\"font:800 40px/1.05 var(--pg-font-sans);letter-spacing:-.03em;margin:10px 0 8px\">Plus Jakarta Sans<\u002Fdiv>\n      <p style=\"font-size:13px\">Geometris, apertur terbuka, dan terbaca pada 12–14px di layar Android. Bobot yang dipakai: 400 body · 500 label &amp; angka · 600 tombol dan judul kartu · 700 judul layar · 800 wordmark.<\u002Fp>\n      <div class=\"anno\" style=\"margin-top:10px\">--pg-font-sans · 400 500 600 700 800<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"eyebrow\">Data &amp; identitas mesin<\u002Fdiv>\n      <div style=\"font:500 32px/1.1 var(--pg-font-mono);margin:10px 0 8px\">JetBrains Mono<\u002Fdiv>\n      <p style=\"font-size:13px\">Hanya untuk string yang harus dibaca persis: nomor order, plat, koordinat, OTP, timestamp log, referensi pembayaran, nilai API. <strong>Bukan<\u002Fstrong> untuk penekanan.<\u002Fp>\n      <div class=\"anno\" style=\"margin-top:10px\">--pg-font-mono · 400 500 700<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"inset\" style=\"margin-top:16px\">\n    <p style=\"font-size:13px\"><strong>Substitusi.<\u002Fstrong> Font brand belum diberikan — teks di file sticker sudah di-<em>outline<\u002Fem>, jadi tidak menyimpan informasi typeface. Plus Jakarta Sans dipilih sebagai padanan terdekat. Kalau PaxGO punya font sendiri, cukup ganti <span class=\"m\">tokens/fonts.css<\u002Fspan>; seluruh skala di bawah tetap berlaku.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Skala tipe<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th class=\"m\">Token<\u002Fth><th>Size / line<\u002Fth><th>Tracking<\u002Fth><th>Weight<\u002Fth><th>Dipakai untuk<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody><tr>\n        <td class=\"m\">--pg-display-lg-*<\u002Ftd><td class=\"num\">44 / 48<\u002Ftd><td class=\"num\">−0.03em<\u002Ftd>\n        <td class=\"num\">800<\u002Ftd><td>Angka besar, halaman kosong, splash<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-display-md-*<\u002Ftd><td class=\"num\">34 / 40<\u002Ftd><td class=\"num\">−0.025em<\u002Ftd>\n        <td class=\"num\">700<\u002Ftd><td>Total biaya, saldo, nominal pendapatan<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-display-sm-*<\u002Ftd><td class=\"num\">28 / 34<\u002Ftd><td class=\"num\">−0.02em<\u002Ftd>\n        <td class=\"num\">700<\u002Ftd><td>ETA besar, total di ringkasan biaya<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-heading-lg-*<\u002Ftd><td class=\"num\">22 / 28<\u002Ftd><td class=\"num\">−0.015em<\u002Ftd>\n        <td class=\"num\">700<\u002Ftd><td>Judul layar, judul halaman admin<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-heading-md-*<\u002Ftd><td class=\"num\">18 / 24<\u002Ftd><td class=\"num\">−0.01em<\u002Ftd>\n        <td class=\"num\">600<\u002Ftd><td>Judul seksi, judul dialog<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-heading-sm-*<\u002Ftd><td class=\"num\">16 / 22<\u002Ftd><td class=\"num\">−0.005em<\u002Ftd>\n        <td class=\"num\">600<\u002Ftd><td>Judul kartu<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-body-lg-*<\u002Ftd><td class=\"num\">16 / 24<\u002Ftd><td class=\"num\">0<\u002Ftd>\n        <td class=\"num\">400<\u002Ftd><td>Paragraf mobile, detail order<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-body-md-*<\u002Ftd><td class=\"num\">14 / 21<\u002Ftd><td class=\"num\">0<\u002Ftd>\n        <td class=\"num\">400<\u002Ftd><td>Default seluruh sistem, baris tabel<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-body-sm-*<\u002Ftd><td class=\"num\">13 / 19<\u002Ftd><td class=\"num\">0<\u002Ftd>\n        <td class=\"num\">400<\u002Ftd><td>Metadata sekunder, label tabel<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-label-*<\u002Ftd><td class=\"num\">13 / 16<\u002Ftd><td class=\"num\">+0.005em<\u002Ftd>\n        <td class=\"num\">500<\u002Ftd><td>Label field, label baris<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-caption-*<\u002Ftd><td class=\"num\">12 / 16<\u002Ftd><td class=\"num\">0<\u002Ftd>\n        <td class=\"num\">400<\u002Ftd><td>Keterangan, timestamp, hint<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-overline-*<\u002Ftd><td class=\"num\">11 / 14<\u002Ftd><td class=\"num\">+0.08em<\u002Ftd>\n        <td class=\"num\">700<\u002Ftd><td>Eyebrow seksi, header grup (UPPERCASE)<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-mono-*<\u002Ftd><td class=\"num\">13 / 18<\u002Ftd><td class=\"num\">0<\u002Ftd>\n        <td class=\"num\">400/500<\u002Ftd><td>ID order, plat, koordinat, log<\u002Ftd><\u002Ftr><\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n    <p style=\"margin-top:12px\">Aturan turunannya: <strong>display dan heading memakai tracking negatif<\u002Fstrong> (makin besar makin rapat), body tidak pernah. Line-height 1,5 untuk body dan 1,2–1,3 untuk heading. Lantai ukuran adalah 12px di mobile dan 13px untuk baris tabel — tidak pernah lebih kecil.<\u002Fp>\n\n    <h3 style=\"margin-top:22px\">Spesimen<\u002Fh3>\n    <div class=\"card\">\n      <div class=\"spec\" style=\"display:flex;flex-direction:column;gap:18px\">\n        <div><div style=\"font:800 44px/48px var(--pg-font-sans);letter-spacing:-.03em\">Rp 1.240.000<\u002Fdiv><div class=\"anno\">display-lg · 800 · tabular-nums<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:700 34px/40px var(--pg-font-sans);letter-spacing:-.025em\">18 menit lagi<\u002Fdiv><div class=\"anno\">display-md · 700<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:700 22px/28px var(--pg-font-sans);letter-spacing:-.015em\">Detail pengiriman<\u002Fdiv><div class=\"anno\">heading-lg · 700 · judul layar<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:600 16px/22px var(--pg-font-sans)\">Ringkasan biaya<\u002Fdiv><div class=\"anno\">heading-sm · 600 · judul kartu<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:400 16px/24px var(--pg-font-sans);max-width:52ch\">Driver akan menghubungi kamu bila lokasi pickup sulit ditemukan. Pastikan nomor penerima aktif sebelum barang diambil.<\u002Fdiv><div class=\"anno\">body-lg · 400 · paragraf mobile<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:400 14px/21px var(--pg-font-sans);max-width:60ch\">Tarif terkunci setelah konfirmasi, kecuali ada perubahan order yang disetujui admin.<\u002Fdiv><div class=\"anno\">body-md · 400 · default sistem<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:500 13px/16px var(--pg-font-sans)\">Alamat pickup<\u002Fdiv><div class=\"anno\">label · 500 · label field<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:400 12px/16px var(--pg-font-sans);color:var(--pg-text-tertiary)\">Diperbarui 5 detik lalu<\u002Fdiv><div class=\"anno\">caption · 400 · tersier<\u002Fdiv><\u002Fdiv>\n        <div><div class=\"eyebrow\">ORDER AKTIF<\u002Fdiv><div class=\"anno\">overline · 700 · +0.08em · satu-satunya UPPERCASE<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font:500 15px/20px var(--pg-font-mono)\">PX-240815-0431 · B 4231 XYZ · -6.21462, 106.84513<\u002Fdiv><div class=\"anno\">mono · 500 · dibaca karakter per karakter<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Angka<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>Pakai tabular<\u002Fh4>\n        <div class=\"pg-tnum\" style=\"font:600 20px/1.5 var(--pg-font-sans)\">Rp 1.240.000<br>Rp 45.000<br>Rp 310.000<\u002Fdiv>\n        <p style=\"font-size:13px;margin-top:10px\">Kolom uang, countdown, dan metrik memakai <span class=\"m\">font-variant-numeric: tabular-nums<\u002Fspan> (helper <span class=\"m\">.pg-tnum<\u002Fspan>) supaya angka tidak bergeser saat berubah.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Jangan proporsional<\u002Fh4>\n        <div style=\"font:600 20px/1.5 var(--pg-font-sans);color:var(--pg-text-tertiary)\">Rp 1.240.000<br>Rp 45.000<br>Rp 310.000<\u002Fdiv>\n        <p style=\"font-size:13px;margin-top:10px\">Tanpa tabular, digit punya lebar berbeda — kolom tabel jadi bergerigi dan countdown terlihat bergetar setiap detik.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Aturan casing<\u002Fh3>\n    <ul>\n      <li><strong>Sentence case di mana-mana<\u002Fstrong> — tombol, header tabel, tab, judul dialog, label field.<\u002Fli>\n      <li>UPPERCASE hanya untuk gaya overline (11px, +0.08em) sebagai eyebrow seksi atau header grup.<\u002Fli>\n      <li>Tidak ada Title Case. Tidak ada ALL CAPS pada tombol.<\u002Fli>\n      <li>Nama brand selalu <span class=\"m\">PaxGO<\u002Fspan> — bukan PaxGo, Paxgo, PAX GO, atau Pax-Go.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"copy\">\n  <header><div class=\"eyebrow\">05<\u002Fdiv><h2>Copywriting &amp; format<\u002Fh2><\u002Fheader>\n  <p>Bahasa UI adalah <strong>Bahasa Indonesia<\u002Fstrong>, sentence case, ringkas, tidak mengobrol. Istilah logistik tetap Inggris karena begitulah tim ops Indonesia bicara: <em>pickup, dropoff, dispatch, driver, order, tracking, POD, geofence, surcharge, settlement, SLA<\u002Fem>. Jangan diterjemahkan di tengah alur.<\u002Fp>\n\n  <div class=\"grid2\" style=\"margin-top:20px\">\n    <div class=\"card\">\n      <h4>Suara<\u002Fh4>\n      <p style=\"font-size:13px\">Operator yang tenang, bukan penjual. Sistem menyebut fakta dan aksi berikutnya, dan tidak pernah memuji dirinya sendiri. Aksi sistem ditulis impersonal: <strong>\"Driver ditemukan\"<\u002Fstrong>, bukan \"Kami menemukan driver\".<\u002Fp>\n      <p style=\"font-size:13px;margin-top:10px\">Panggilan: <strong>kamu<\u002Fstrong> di Customer, <strong>Anda<\u002Fstrong> di Driver dan Admin.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h4>Format angka<\u002Fh4>\n      <div class=\"tw\" style=\"border:none\"><table>\n        <tbody>\n          <tr><td>Uang<\u002Ftd><td class=\"m\">Rp 45.000<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">titik ribuan, tanpa desimal<\u002Ftd><\u002Ftr>\n          <tr><td>Jarak<\u002Ftd><td class=\"m\">12,4 km<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">satu desimal, koma<\u002Ftd><\u002Ftr>\n          <tr><td>Durasi<\u002Ftd><td class=\"m\">18 menit · 1 jam 20 mnt<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">bulat<\u002Ftd><\u002Ftr>\n          <tr><td>Jam<\u002Ftd><td class=\"m\">14:35<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">24 jam<\u002Ftd><\u002Ftr>\n          <tr><td>Tanggal (baris)<\u002Ftd><td class=\"m\">5 Agu 2026<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">singkat<\u002Ftd><\u002Ftr>\n          <tr><td>Tanggal (detail)<\u002Ftd><td class=\"m\">5 Agustus 2026, 14:35<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">panjang<\u002Ftd><\u002Ftr>\n          <tr><td>Nomor order<\u002Ftd><td class=\"m\">PX-240815-0431<\u002Ftd><td style=\"color:var(--pg-text-tertiary);font-size:12px\">mono, kapital<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Pola pesan<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:130px\">Situasi<\u002Fth><th>Pola<\u002Fth><th>Contoh benar<\u002Fth><th>Jangan<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><strong>Tombol<\u002Fstrong><\u002Ftd><td>Kata kerja + objek<\u002Ftd><td>\"Pesan sekarang\" · \"Konfirmasi pickup\" · \"Selesaikan pengiriman\"<\u002Ftd><td class=\"bad\">\"OK\", \"Submit\", \"Kirim\"<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Halaman kosong<\u002Fstrong><\u002Ftd><td>Satu fakta + satu aksi<\u002Ftd><td>\"Belum ada order aktif.\" + tombol \"Pesan pengiriman\"<\u002Ftd><td class=\"bad\">Ilustrasi kardus sedih, lelucon<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Error<\u002Fstrong><\u002Ftd><td>Sebab + jalan keluar<\u002Ftd><td>\"Alamat tujuan di luar area layanan. Pilih titik lain atau hubungi admin.\"<\u002Ftd><td class=\"bad\">\"Terjadi kesalahan\"; kode error se
