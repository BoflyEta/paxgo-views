span style=\"width:72px;height:56px;border-radius:999px;background:var(--pg-brand-50);border:1.5px solid var(--pg-brand-300)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">pill · 999px<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">pill, avatar, chip<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Anatomi kartu<\u002Fh3>\n    <div class=\"grid2\">\n      <div>\n        <div style=\"background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);border-radius:var(--pg-radius-lg);box-shadow:var(--pg-shadow-sm);padding:16px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px\">\n            <span style=\"font:var(--pg-text-card-title)\">Ringkasan biaya<\u002Fspan>\n            <span class=\"pill\" style=\"background:var(--pg-state-assigned-bg);color:var(--pg-state-assigned-fg);padding:5px 10px;font-size:12px\"><i><\u002Fi>Menunggu<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"display:flex;justify-content:space-between;font:400 13px/19px var(--pg-font-sans);color:var(--pg-text-secondary)\"><span>Tarif dasar (motor)<\u002Fspan><span class=\"pg-tnum\" style=\"color:var(--pg-text-primary)\">Rp 12.000<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font:400 13px/19px var(--pg-font-sans);color:var(--pg-text-secondary)\"><span>Jarak 12,4 km<\u002Fspan><span class=\"pg-tnum\" style=\"color:var(--pg-text-primary)\">Rp 28.400<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:1px;background:var(--pg-border-subtle);margin:12px 0\"><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font:600 14px/1 var(--pg-font-sans)\">Total<\u002Fspan><span class=\"pg-tnum\" style=\"font:700 20px/1 var(--pg-font-sans)\">Rp 45.000<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Resepnya<\u002Fh4>\n        <ul>\n          <li>Fill <span class=\"m\">--pg-bg-surface<\u002Fspan><\u002Fli>\n          <li>Border <span class=\"m\">1px solid --pg-border-subtle<\u002Fspan><\u002Fli>\n          <li>Radius <span class=\"m\">--pg-radius-lg<\u002Fspan> (20px)<\u002Fli>\n          <li>Shadow <span class=\"m\">--pg-shadow-sm<\u002Fspan><\u002Fli>\n          <li>Padding 16px<\u002Fli>\n        <\u002Ful>\n        <p style=\"font-size:13px;margin-top:10px\"><strong>Border dan shadow dipakai bersama.<\u002Fstrong> Border-lah yang menahan bentuk di tema gelap, tempat shadow hampir tidak terlihat. Panel bersarang melepas shadow dan memakai <span class=\"m\">--pg-bg-inset<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Tangga elevasi<\u002Fh3>\n    <div class=\"card\">\n      <div class=\"row\" style=\"gap:18px\">\n        <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-xs)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">xs<\u002Fb><span class=\"anno\" style=\"text-align:center\">sticky header, pembatas halus<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-sm)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">sm<\u002Fb><span class=\"anno\" style=\"text-align:center\">kartu<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-md)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">md<\u002Fb><span class=\"anno\" style=\"text-align:center\">dropdown, popover, FAB<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-lg)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">lg<\u002Fb><span class=\"anno\" style=\"text-align:center\">modal, toast<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-brand)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">brand<\u002Fb><span class=\"anno\" style=\"text-align:center\">FAB primer (glow biru)<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:8px;width:120px\">\n            <span style=\"width:104px;height:60px;border-radius:var(--pg-radius-md);background:var(--pg-bg-surface);border:1px solid var(--pg-border-subtle);box-shadow:var(--pg-shadow-sheet)\"><\u002Fspan>\n            <b style=\"font:600 11px/1 var(--pg-font-mono)\">sheet<\u002Fb><span class=\"anno\" style=\"text-align:center\">bottom sheet (ke atas)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin-top:12px\">Shadow ber-tint <span class=\"m\">#070808<\u002Fspan> dengan alpha rendah — tidak pernah hitam pekat. Inner shadow hanya dipakai di dua tempat: field pencarian dan ribbon \"GPS stale\" di peta.<\u002Fp>\n\n    <h3 style=\"margin-top:22px\">Transparansi &amp; blur<\u002Fh3>\n    <p>Dipakai di tiga tempat saja: app bar kaca di atas peta yang menggulir (<span class=\"m\">--pg-glass-bg<\u002Fspan> + <span class=\"m\">--pg-blur-glass<\u002Fspan>), scrim modal (<span class=\"m\">--pg-bg-scrim<\u002Fspan>), dan fill poligon geofence (10% brand). <strong>Tidak pernah blur di belakang teks isi.<\u002Fstrong><\u002Fp>\n\n    <div class=\"grid2\" style=\"margin-top:20px\">\n      <div class=\"do\"><h4>Lakukan<\u002Fh4><ul>\n        <li>Satu level elevasi per lapisan; jangan menumpuk shadow.<\u002Fli>\n        <li>Panel di dalam kartu: inset + tanpa shadow.<\u002Fli>\n        <li>Radius konsisten per kelas elemen, bukan per layar.<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n      <div class=\"dont\"><h4>Hindari<\u002Fh4><ul>\n        <li>Kartu dengan aksen border kiri berwarna.<\u002Fli>\n        <li>Kartu di atas kartu di atas kartu.<\u002Fli>\n        <li>Shadow hitam pekat atau spread besar.<\u002Fli>\n        <li>Radius campur (12px di satu kartu, 20px di kartu sebelahnya).<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"button\">\n  <header><div class=\"eyebrow\">08<\u002Fdiv><h2>Button<\u002Fh2><\u002Fheader>\n  <p>Tombol adalah tempat sistem ini paling sering dinilai. Lima varian, tiga ukuran, enam state — dan satu aturan yang mengatur semuanya: <strong>label tombol adalah kata kerja, dan hanya ada satu tombol biru per layar.<\u002Fstrong><\u002Fp>\n\n  <div class=\"sub\">\n    <h3>Anatomi<\u002Fh3>\n    <div class=\"card\">\n      <div class=\"row\" style=\"gap:28px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:280px\">\n          <div class=\"anno\">height 52px · radius 14px (--pg-radius-md)<\u002Fdiv>\n          <button class=\"btn btn-primary btn-lg\"><i data-lucide=\"package\"><\u002Fi>Pesan sekarang<\u002Fbutton>\n          <div class=\"anno\">padding 0 20px · gap ikon–label 8px · font 600 15px<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:240px\">\n          <div class=\"tw\" style=\"border:none\"><table><tbody>\n            <tr><td>Tinggi<\u002Ftd><td class=\"m\">36 / 44 / 52px<\u002Ftd><\u002Ftr>\n            <tr><td>Radius<\u002Ftd><td class=\"m\">--pg-radius-md (14px)<\u002Ftd><\u002Ftr>\n            <tr><td>Padding<\u002Ftd><td class=\"m\">12 / 16 / 20px<\u002Ftd><\u002Ftr>\n            <tr><td>Font<\u002Ftd><td class=\"m\">600 · 13 / 14 / 15px<\u002Ftd><\u002Ftr>\n            <tr><td>Ikon<\u002Ftd><td class=\"m\">16 / 18 / 20px · stroke 1.75<\u002Ftd><\u002Ftr>\n            <tr><td>Gap<\u002Ftd><td class=\"m\">6 / 8 / 8px<\u002Ftd><\u002Ftr>\n          <\u002Ftbody><\u002Ftable><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">Varian<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:150px\">Varian<\u002Fth><th style=\"width:190px\">Contoh<\u002Fth><th>Kapan dipakai<\u002Fth><th class=\"m\" style=\"width:200px\">Token fill<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><strong>primary<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-primary\">Pesan sekarang<\u002Fbutton><\u002Ftd>\n            <td>Satu aksi utama per layar. Maju di dalam alur, konfirmasi, submit.<\u002Ftd><td class=\"m\">--pg-action-primary<\u002Ftd><\u002Ftr>\n        <tr><td><strong>secondary<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-secondary\">Ubah alamat<\u002Fbutton><\u002Ftd>\n            <td>Aksi setara atau alternatif. Tombol batal di dialog. Toolbar admin.<\u002Ftd><td class=\"m\">--pg-action-secondary + border<\u002Ftd><\u002Ftr>\n        <tr><td><strong>ghost<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-ghost\">Lihat semua<\u002Fbutton><\u002Ftd>\n            <td>Aksi tersier inline: \"Lihat semua\", \"Detail\", \"Ubah\" di header kartu.<\u002Ftd><td class=\"m\">transparan · teks brand<\u002Ftd><\u002Ftr>\n        <tr><td><strong>accent<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-accent\">Terima order<\u002Fbutton><\u002Ftd>\n            <td><strong>Hanya app Driver<\u002Fstrong>, untuk aksi mendesak yang harus mengalahkan tombol biru di layar yang sama.<\u002Ftd><td class=\"m\">--pg-action-accent<\u002Ftd><\u002Ftr>\n        <tr><td><strong>danger<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-danger\">Batalkan order<\u002Fbutton><\u002Ftd>\n            <td>Aksi destruktif yang tidak bisa dibatalkan: cancel, force cancel, hapus.<\u002Ftd><td class=\"m\">--pg-action-danger (danger-600)<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">Ukuran<\u002Fh3>\n    <div class=\"card\">\n      <div class=\"row\" style=\"gap:24px;align-items:flex-end\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\">\n          <button class=\"btn btn-primary btn-sm\">Export<\u002Fbutton><span class=\"anno\">sm · 36px · toolbar &amp; tabel admin<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\">\n          <button class=\"btn btn-primary\">Simpan perubahan<\u002Fbutton><span class=\"anno\">md · 44px · default<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\">\n          <button class=\"btn btn-primary btn-lg\">Konfirmasi pickup<\u002Fbutton><span class=\"anno\">lg · 52px · CTA mobile<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:var(--pg-border-subtle);margin:18px 0\"><\u002Fdiv>\n      <h4>Full width (block)<\u002Fh4>\n      <div style=\"max-width:340px;display:flex;flex-direction:column;gap:10px\">\n        <button class=\"btn btn-primary btn-lg\" style=\"width:100%\">Selesaikan pengiriman<\u002Fbutton>\n        <button class=\"btn btn-secondary btn-lg\" style=\"width:100%\">Laporkan gagal kirim<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;margin-top:12px\">CTA primer mobile <strong>selalu<\u002Fstrong> <span class=\"m\">size=\"lg\"<\u002Fspan> + <span class=\"m\">block<\u002Fspan>, full-bleed di dalam gutter 20px, dan menempel di sticky bar berlatar kaca. Di admin, tombol tidak pernah block kecuali di dalam panel sempit.<\u002Fp>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">State<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:120px\">State<\u002Fth><th style=\"width:200px\">Primary<\u002Fth><th style=\"width:200px\">Secondary<\u002Fth><th>Aturan<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><strong>Rest<\u002Fstrong><\u002Ftd><td><button class=\"btn btn-primary\">Pesan sekarang<\u002Fbutton><\u002Ftd><td><button class=\"btn btn-secondary\">Ubah alamat<\u002Fbutton><\u002Ftd><td>Shadow <span class=\"m\">xs<\u002Fspan> pada fill berwarna; secondary tanpa shadow selain hairline.<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Hover<\u002Fstrong><br><span class=\"anno\">web saja<\u002Fspan><\u002Ftd>\n            <td><button class=\"btn btn-primary\" style=\"background:var(--pg-action-primary-hover)\">Pesan sekarang<\u002Fbutton><\u002Ftd>\n            <td><button class=\"btn btn-secondary\" style=\"background:var(--pg-action-secondary-hover)\">Ubah alamat<\u002Fbutton><\u002Ftd>\n            <td>Fill turun satu langkah (500 → 600). <strong>Tidak pernah fade opacity.<\u002Fstrong> Tidak ada hover di kit mobile.<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Press<\u002Fstrong><\u002Ftd>\n            <td><button class=\"btn btn-primary\" style=\"background:var(--pg-action-primary-press);transform:scale(.975)\">Pesan sekarang<\u002Fbutton><\u002Ftd>\n            <td><button class=\"btn btn-secondary\" style=\"background:var(--pg-n-100);transform:scale(.975)\">Ubah alamat<\u002Fbutton><\u002Ftd>\n            <td>Fill turun satu langkah lagi <em>dan<\u002Fem> <span class=\"m\">scale(0.975)<\u002Fspan>. Di mobile inilah satu-satunya umpan balik sentuh.<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Focus<\u002Fstrong><\u002Ftd>\n            <td><button class=\"btn btn-primary is-focus\">Pesan sekarang<\u002Fbutton><\u002Ftd>\n            <td><button class=\"btn btn-secondary is-focus\">Ubah alamat<\u002Fbutton><\u002Ftd>\n            <td>Halo 3px <span class=\"m\">--pg-focus-ring<\u002Fspan> (brand 28%). Outline tidak pernah dihapus tanpa pengganti.<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Loading<\u002Fstrong><\u002Ftd>\n            <td><button class=\"btn btn-primary\"><span class=\"spin\"><\u002Fspan>Mencari driver<\u002Fbutton><\u002Ftd>\n            <td><button class=\"btn btn-secondary\"><span class=\"spin\" style=\"border-color:var(--pg-n-300);border-top-color:transparent\"><\u002Fspan>Memuat<\u002Fbutton><\u002Ftd>\n            <td>Spinner mengganti ikon kiri, label tetap, input diblokir. Label boleh berubah menjadi progresif (\"Mencari driver\").<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Disabled<\u002Fstrong><\u002Ftd>\n            <td><button class=\"btn btn-primary\" disabled=\"\">Pesan sekarang<\u002Fbutton><\u002Ftd>\n            <td><button class=\"btn btn-secondary\" disabled=\"\">Ubah alamat<\u002Fbutton><\u002Ftd>\n            <td>Fill <span class=\"m\">--pg-action-disabled<\u002Fspan>, label <span class=\"m\">--pg-text-disabled<\u002Fspan>, tanpa shadow, <span class=\"m\">cursor: not-allowed<\u002Fspan>. <strong>Disabled bukan berarti tak terlihat.<\u002Fstrong><\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">Pengecualian varian accent<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <div class=\"row\" style=\"gap:10px\">\n          <button class=\"btn btn-accent btn-lg\">Terima order<\u002Fbutton>\n          <button class=\"btn btn-accent btn-lg\" style=\"background:var(--pg-action-accent-hover)\">Terima order<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;margin-top:12px\">Rest <span class=\"m\">accent-500<\u002Fspan> → hover <span class=\"m\">accent-400<\u002Fspan>. Oranye <strong>menjadi lebih terang<\u002Fstrong> saat hover, karena menggelapkannya membuat tinta gelap maupun putih gagal 4,5:1. Tinta selalu <span class=\"m\">--pg-n-950<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"dont\">\n        <h4>Jangan pada accent<\u002Fh4>\n        <ul>\n          <li>Teks putih di atas oranye (2,79:1 — gagal).<\u002Fli>\n          <li>Menggelapkan fill saat hover.<\u002Fli>\n          <li>Memakainya di app Customer atau Admin.<\u002Fli>\n          <li>Dua tombol accent dalam satu layar.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">Ikon di dalam tombol<\u002Fh3>\n    <div class=\"card\">\n      <div class=\"row\" style=\"gap:12px\">\n        <button class=\"btn btn-primary\"><i data-lucide=\"package\"><\u002Fi>Pesan sekarang<\u002Fbutton>\n        <button class=\"btn btn-secondary\"><i data-lucide=\"download\"><\u002Fi>Export<\u002Fbutton>\n        <button class=\"btn btn-secondary\">Lanjut<i data-lucide=\"arrow-right\"><\u002Fi><\u002Fbutton>\n        <button class=\"btn btn-secondary\" style=\"width:44px;padding:0\"><i data-lucide=\"ellipsis\"><\u002Fi><\u002Fbutton>\n      <\u002Fdiv>\n      <ul style=\"margin-top:14px\">\n        <li>Ikon <strong>kiri<\u002Fstrong> memperkuat makna aksi (\"Pesan\", \"Export\", \"Buka navigasi\").<\u002Fli>\n        <li>Ikon <strong>kanan<\u002Fstrong> hanya untuk arah atau keluar konteks (<span class=\"m\">arrow-right<\u002Fspan>, <span class=\"m\">external-link<\u002Fspan>, <span class=\"m\">chevron-down<\u002Fspan> pada menu).<\u002Fli>\n        <li>Tombol hanya-ikon memakai komponen <span class=\"m\">IconButton<\u002Fspan> dengan <span class=\"m\">label<\u002Fspan> wajib — kotak radius 10px, bukan bulat (kecuali FAB peta).<\u002Fli>\n        <li>Satu ikon per tombol. Tidak pernah ikon di kedua sisi.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:24px\">Penempatan &amp; hierarki<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>Dialog &amp; sticky bar<\u002Fh4>\n        <div style=\"border:1px solid var(--pg-border-subtle);border-radius:var(--pg-radius-md);padding:14px;background:var(--pg-bg-inset)\">\n          <div style=\"font:700 16px/1.3 var(--pg-font-sans);margin-bottom:6px\">Batalkan order?<\u002Fdiv>\n          <p style=\"font-size:13px;margin-bottom:14px\">Biaya pembatalan Rp 10.000 akan dikenakan karena driver sudah menuju pickup.<\u002Fp>\n          <div class=\"row\" style=\"justify-content:flex-end;gap:8px\">\n            <button class=\"btn btn-secondary btn-sm\">Tidak<\u002Fbutton>\n            <button class=\"btn btn-danger btn-sm\">Batalkan order<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <ul style=\"margin-top:12px\">\n          <li>Urutan: <strong>sekunder dulu, aksi utama di paling kanan.<\u002Fstrong><\u002Fli>\n          <li>Aksi destruktif memakai varian danger, bukan primary merah.<\u002Fli>\n          <li>Label mengulang kata kerjanya (\"Batalkan order\"), bukan \"Ya\".<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Rasio lebar di mobile<\u002Fh4>\n        <div style=\"display:flex;gap:10px;max-width:320px\">\n          <button class=\"btn btn-secondary btn-lg\" style=\"flex:1\">Tolak<\u002Fbutton>\n          <button class=\"btn btn-primary btn-lg\" style=\"flex:2\">Terima order<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;margin-top:12px\">Saat dua aksi berdampingan dan salah satunya jelas lebih diinginkan, beri aksi utama <span class=\"m\">flex: 2<\u002Fspan> dan aksi menolak <span class=\"m\">flex: 1<\u002Fspan>. Kalau keduanya setara, bagi rata.<\u002Fp>\n        <p style=\"font-size:13px;margin-top:8px\">Maksimum dua tombol dalam satu baris di mobile. Yang ketiga turun menjadi ghost di baris sendiri.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid2\" style=\"margin-top:22px\">\n      <div class=\"do\"><h4>Lakukan<\u002Fh4><ul>\n        <li>Satu primary per layar; sisanya secondary atau ghost.<\u002Fli>\n        <li>Label kata kerja: \"Konfirmasi pickup\", \"Cairkan sekarang\".<\u002Fli>\n        <li>Blokir tombol saat proses berjalan dengan state loading, bukan menyembunyikannya.<\u002Fli>\n        <li>Pertahankan lebar tombol saat label berubah menjadi loading, supaya layout tidak bergeser.<\u002Fli>\n        <li>Biarkan tombol disabled tetap terlihat dan jelaskan penyebabnya di dekatnya.<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n      <div class=\"dont\"><h4>Hindari<\u002Fh4><ul>\n        <li>\"OK\", \"Submit\", \"Kirim\" tanpa objek.<\u002Fli>\n        <li>ALL CAPS atau Title Case pada label.<\u002Fli>\n        <li>Dua tombol berisi fill berwarna berdampingan (biru + merah).<\u002Fli>\n        <li>Hover berupa perubahan opacity.<\u002Fli>\n        <li>Tombol teks tanpa padding yang menyamar sebagai tautan di mobile.<\u002Fli>\n        <li>Tombol destruktif sebagai aksi default (paling kanan + primary) tanpa konfirmasi.<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"form\">\n  <header><div class=\"eyebrow\">09<\u002Fdiv><h2>Form &amp; input<\u002Fh2><\u002Fheader>\n  <p>Semua kontrol memakai tinggi, radius, dan perilaku fokus yang sama, jadi satu formulir terasa seperti satu benda. Label di atas field — tidak pernah placeholder sebagai label.<\u002Fp>\n\n  <div class=\"grid2\" style=\"margin-top:20px\">\n    <div class=\"card\">\n      <h4>Anatomi field<\u002Fh4>\n      <div style=\"display:flex;flex-direction:column;gap:6px;max-width:320px\">\n        <label style=\"font:500 13px/16px var(--pg-font-sans)\">Berat barang <span style=\"color:var(--pg-text-danger)\">*<\u002Fspan><\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:var(--pg-bg-surface);border:1px solid var(--pg-border-default);border-radius:var(--pg-radius-md)\">\n          <span style=\"flex:1;font:400 14px/1.4 var(--pg-font-sans)\">12<\u002Fspan>\n          <span style=\"font:400 13px/1 var(--pg-font-sans);color:var(--pg-text-tertiary)\">kg<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font:400 12px/16px var(--pg-font-sans);color:var(--pg-text-tertiary)\">Maks 20 kg untuk armada motor<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"anno\" style=\"margin-top:12px\">label 13/16 · field 46px · gap 6px · hint 12/16<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h4>State<\u002Fh4>\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:320px\">\n        <div style=\"height:46px;padding:0 12px;display:flex;align-items:center;background:var(--pg-bg-surface);border:1px solid var(--pg-border-default);border-radius:var(--pg-radius-md);font:400 14px/1 var(--pg-font-sans)\">Rest<\u002Fdiv>\n        <div style=\"height:46px;padding:0 12px;display:flex;align-items:center;background:var(--pg-bg-surface);border:1px solid var(--pg-border-focus);border-radius:var(--pg-radius-md);box-shadow:var(--pg-focus-ring);font:400 14px/1 var(--pg-font-sans)\">Focus<\u002Fdiv>\n        <div style=\"height:46px;padding:0 12px;display:flex;align-items:center;background:var(--pg-bg-surface);border:1px solid var(--pg-danger-500);border-radius:var(--pg-radius-md);font:400 14px/1 var(--pg-font-sans)\">Invalid<\u002Fdiv>\n        <div style=\"height:46px;padding:0 12px;display:flex;align-items:center;background:var(--pg-bg-sunken);border:1px solid var(--pg-border-default);border-radius:var(--pg-radius-md);font:400 14px/1 var(--pg-font-sans);color:var(--pg-text-disabled)\">Disabled<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13px;margin-top:12px\">Border merah hanya menandai; <strong>pesannya ada di slot error<\u002Fstrong> di bawah field, menyebut sebab dan jalan keluar.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Memilih kontrol<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:150px\">Kontrol<\u002Fth><th>Pakai saat<\u002Fth><th>Jangan<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td><strong>Radio<\u002Fstrong><\u002Ftd><td>2–5 pilihan eksklusif yang perlu terlihat semua: metode bayar, alasan penolakan, tindak lanjut gagal kirim.<\u002Ftd><td class=\"bad\">Lebih dari 5 pilihan<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Select<\u002Fstrong><\u002Ftd><td>6+ pilihan, atau daftar panjang: area, bank, jenis barang.<\u002Ftd><td class=\"bad\">2–3 pilihan pendek<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Tabs segmented<\u002Fstrong><\u002Ftd><td>Filter rentang dalam panel: \"Hari ini / 7 hari / 30 hari\".<\u002Ftd><td class=\"bad\">Sebagai input formulir<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Checkbox<\u002Fstrong><\u002Ftd><td>Pilihan majemuk dan persetujuan; baris \"pilih semua\" memakai state indeterminate.<\u002Ftd><td class=\"bad\">Satu toggle yang berlaku seketika<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Switch<\u002Fstrong><\u002Ftd><td>On/off yang berlaku <em>seketika<\u002Fem>: status online driver, notifikasi.<\u002Ftd><td class=\"bad\">Dipasangkan dengan tombol Simpan<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Stepper<\u002Fstrong><\u002Ftd><td>Bilangan bulat kecil: jumlah koli, jumlah stop.<\u002Ftd><td class=\"bad\">Nilai bebas seperti berat<\u002Ftd><\u002Ftr>\n        <tr><td><strong>Search field<\u002Fstrong><\u002Ftd><td>Pencarian daftar. Satu-satunya kontrol dengan inner shadow.<\u002Ftd><td class=\"bad\">Sebagai field biasa<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Aturan formulir<\u002Fh3>\n    <ul>\n      <li>Tandai <strong>field wajib<\u002Fstrong> dengan asterisk merah, bukan menandai yang opsional.<\u002Fli>\n      <li>Validasi saat blur, bukan saat mengetik. Pesan error mengganti hint, tidak menambah baris baru.<\u002Fli>\n      <li>Formulir panjang di mobile memakai sticky bar untuk aksi utama, dan tombol tetap disabled sampai syarat minimum terpenuhi (lihat checklist pickup).<\u002Fli>\n      <li>Setiap override admin wajib punya field <em>Alasan<\u002Fem> bebas dan tercatat di audit log.<\u002Fli>\n      <li>Input mono (OTP, plat, koordinat, nomor rekening) memakai <span class=\"m\">--pg-font-mono<\u002Fspan> agar salah baca berkurang.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ikon\">\n  <header><div class=\"eyebrow\">10<\u002Fdiv><h2>Ikonografi<\u002Fh2><\u002Fheader>\n  <p><strong>Lucide<\u002Fstrong>, stroke 1,75, ujung dan sambungan bulat, <span class=\"m\">currentColor<\u002Fspan>. Terminal bulat Lucide cocok dengan geometri radius besar sistem ini.<\u002Fp>\n\n  <div class=\"inset\" style=\"margin-top:16px\">\n    <p style=\"font-size:13px\"><strong>Substitusi.<\u002Fstrong> Tidak ada icon set yang diberikan bersama brief. Kalau PaxGO membuat set sendiri, seluruh bab ini berubah. Yang tetap: satu set, satu bobot stroke, dan tidak ada glyph gambar tangan.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"card\" style=\"margin-top:16px\">\n    <div class=\"row\" id=\"icongrid\" style=\"gap:18px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>Ukuran<\u002Fh4>\n        <div class=\"tw\" style=\"border:none\"><table><tbody>\n          <tr><td class=\"m\">16px<\u002Ftd><td>Sejajar teks 13–14px<\u002Ftd><\u002Ftr>\n          <tr><td class=\"m\">20px<\u002Ftd><td>Baris daftar, tab, sidebar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"m\">24px<\u002Ftd><td>Default, app bar, armada<\u002Ftd><\u002Ftr>\n          <tr><td class=\"m\">28px<\u002Ftd><td>FAB peta<\u002Ftd><\u002Ftr>\n          <tr><td class=\"m\">32px<\u002Ftd><td>Halaman kosong<\u002Ftd><\u002Ftr>\n        <\u002Ftbody><\u002Ftable><\u002Fdiv>\n        <p style=\"font-size:13px;margin-top:10px\">Jangan memperbesar glyph 24px melewati 32px — pilih ukuran nominal yang lebih besar.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Aturan<\u002Fh4>\n        <ul>\n          <li>Bobot stroke seragam. Jangan mencampur ikon <em>outline<\u002Fem> dan <em>filled<\u002Fem> dalam satu baris.<\u002Fli>\n          <li>Satu-satunya glyph <em>filled<\u002Fem> di sistem: ikon tab aktif dan bintang rating.<\u002Fli>\n          <li>Ikon mewarisi warna teks. Ikon biru berarti ia bagian dari kontrol brand, bukan hiasan.<\u002Fli>\n          <li>Armada memakai <span class=\"m\">bike<\u002Fspan> / <span class=\"m\">car<\u002Fspan> / <span class=\"m\">truck<\u002Fspan> / <span class=\"m\">container<\u002Fspan> — jangan gambar silhouette sendiri.<\u002Fli>\n          <li>Tanpa emoji. Unicode hanya <span class=\"m\">·<\u002Fspan> dan <span class=\"m\">→<\u002Fspan>.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"motion\">\n  <header><div class=\"eyebrow\">11<\u002Fdiv><h2>Motion<\u002Fh2><\u002Fheader>\n  <p>Cepat dan tidak pamer. Gerakan di sini bertugas menjelaskan perubahan state, bukan menghibur.<\u002Fp>\n\n  <div class=\"card\" style=\"margin-top:20px\">\n    <div class=\"row\" style=\"gap:20px;align-items:flex-end\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:7px;width:130px\">\n          <span style=\"width:25px;height:8px;border-radius:99px;background:var(--pg-brand-500)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">instant · 80ms<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">tooltip, ripple kecil<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:7px;width:130px\">\n          <span style=\"width:44px;height:8px;border-radius:99px;background:var(--pg-brand-500)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">fast · 140ms<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">perubahan state, hover<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:7px;width:130px\">\n          <span style=\"width:69px;height:8px;border-radius:99px;background:var(--pg-brand-500)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">normal · 220ms<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">transisi umum, fade-up<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:7px;width:130px\">\n          <span style=\"width:100px;height:8px;border-radius:99px;background:var(--pg-brand-500)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">slow · 320ms<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">gambar rute, checkmark<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-direction:column;align-items:center;gap:7px;width:130px\">\n          <span style=\"width:113px;height:8px;border-radius:99px;background:var(--pg-brand-500)\"><\u002Fspan>\n          <b style=\"font:600 11px/1 var(--pg-font-mono)\">sheet · 360ms<\u002Fb>\n          <span class=\"anno\" style=\"text-align:center\">bottom sheet masuk<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sub\">\n    <div class=\"tw\"><table>\n      <thead><tr><th class=\"m\" style=\"width:220px\">Easing<\u002Fth><th>Kurva<\u002Fth><th>Dipakai untuk<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td class=\"m\">--pg-ease-standard<\u002Ftd><td class=\"m\">cubic-bezier(.2, 0, 0, 1)<\u002Ftd><td><strong>Default.<\u002Fstrong> Keluar cepat, mendarat lembut.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-ease-out<\u002Ftd><td class=\"m\">cubic-bezier(.16, 1, .3, 1)<\u002Ftd><td>Elemen masuk: sheet, toast, dialog.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-ease-in<\u002Ftd><td class=\"m\">cubic-bezier(.4, 0, 1, 1)<\u002Ftd><td>Elemen keluar.<\u002Ftd><\u002Ftr>\n        <tr><td class=\"m\">--pg-ease-spring<\u002Ftd><td class=\"m\">cubic-bezier(.34, 1.4, .64, 1)<\u002Ftd><td><strong>Hanya dua tempat:<\u002Fstrong> checkmark \"Terkirim\" dan pin peta yang menjatuhkan diri.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Animasi berulang<\u002Fh3>\n    <p style=\"margin-bottom:12px\">Hanya tiga loop yang diizinkan di seluruh sistem. Selain ini, animasi harus punya awal dan akhir.<\u002Fp>\n    <div class=\"grid3\">\n      <div class=\"card\" style=\"text-align:center\">\n        <div style=\"height:64px;display:flex;align-items:center;justify-content:center\">\n          <span style=\"position:relative;display:inline-flex;width:16px;height:16px\">\n            <span style=\"position:absolute;inset:-3px;border-radius:99px;background:var(--pg-accent-500);animation:pg-pulse-ring 1.8s var(--pg-ease-out) infinite\"><\u002Fspan>\n            <span style=\"position:relative;width:16px;height:16px;border-radius:99px;background:var(--pg-accent-500);border:3px solid #fff;box-shadow:var(--pg-shadow-sm)\"><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <h4>Pulse ring<\u002Fh4><p style=\"font-size:12px\">Titik driver hidup &amp; pencarian driver. 1,8s.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"text-align:center\">\n        <div style=\"height:64px;display:flex;align-items:center;justify-content:center\">\n          <span style=\"display:block;width:120px;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--pg-n-100) 25%,var(--pg-n-50) 37%,var(--pg-n-100) 63%);background-size:400% 100%;animation:pg-shimmer 1.4s ease-in-out infinite\"><\u002Fspan>\n        <\u002Fdiv>\n        <h4>Skeleton shimmer<\u002Fh4><p style=\"font-size:12px\">Pemuatan saat bentuk akhir sudah diketahui. 1,4s.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"text-align:center\">\n        <div style=\"height:64px;display:flex;align-items:center;justify-content:center\">\n          <span style=\"width:24px;height:24px;border-radius:99px;border:2px solid var(--pg-n-200);border-top-color:var(--pg-brand-500);animation:pg-spin 700ms linear infinite\"><\u002Fspan>\n        <\u002Fdiv>\n        <h4>Spinner<\u002Fh4><p style=\"font-size:12px\">Pemuatan tak tentu. 700ms linear.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"grid2\" style=\"margin-top:22px\">\n      <div class=\"do\"><h4>Lakukan<\u002Fh4><ul>\n        <li>Batasi durasi ≤ 360ms.<\u002Fli>\n        <li>Animasikan properti yang murah: <span class=\"m\">transform<\u002Fspan> dan <span class=\"m\">opacity<\u002Fspan>.<\u002Fli>\n        <li>Hormati <span class=\"m\">prefers-reduced-motion<\u002Fspan> — sudah ditangani di <span class=\"m\">tokens/base.css<\u002Fspan>.<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n      <div class=\"dont\"><h4>Hindari<\u002Fh4><ul>\n        <li>Parallax, scroll-jacking, daftar yang memantul.<\u002Fli>\n        <li>Spring di luar dua tempat yang disebut.<\u002Fli>\n        <li>Animasi yang menunda aksi pengguna.<\u002Fli>\n        <li>Loop keempat.<\u002Fli>\n      <\u002Ful><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"akses\">\n  <header><div class=\"eyebrow\">12<\u002Fdiv><h2>Aksesibilitas &amp; kontras<\u002Fh2><\u002Fheader>\n  <p>Target: <strong>4,5:1 untuk teks biasa<\u002Fstrong> dan 3:1 untuk teks ≥ 22px. Angka di tabel ini dihitung dari nilai token yang sebenarnya, bukan diperkirakan.<\u002Fp>\n\n  <div class=\"tw\" style=\"margin-top:20px\"><table>\n    <thead><tr><th>Pasangan<\u002Fth><th class=\"m\">Foreground<\u002Fth><th class=\"m\">Background<\u002Fth><th class=\"num\">Rasio<\u002Fth><th>Nilai<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr>\n        <td>Teks utama<\u002Ftd><td class=\"m\">#070808<\u002Ftd><td class=\"m\">#FFFFFF<\u002Ftd>\n <\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Teks brand di brand-50<\u002Ftd><td class=\"m\">#2449BC<\u002Ftd><td class=\"m\">#EDF1FD<\u002Ftd>\n        <td class=\"num\">6,75<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill searching<\u002Ftd><td class=\"m\">#8A6100<\u002Ftd><td class=\"m\">#FFF6DE<\u002Ftd>\n        <td class=\"num\">5,14<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill assigned<\u002Ftd><td class=\"m\">#1B3A97<\u002Ftd><td class=\"m\">#EDF1FD<\u002Ftd>\n        <td class=\"num\">8,86<\u002Ftd><td><span class=\"ok\">AAA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill transit<\u002Ftd><td class=\"m\">#A84900<\u002Ftd><td class=\"m\">#FFF2E6<\u002Ftd>\n        <td class=\"num\">5,28<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill delivered<\u002Ftd><td class=\"m\">#067E37<\u002Ftd><td class=\"m\">#E3F8EB<\u002Ftd>\n        <td class=\"num\">4,67<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill failed<\u002Ftd><td class=\"m\">#A81C12<\u002Ftd><td class=\"m\">#FEEBE9<\u002Ftd>\n        <td class=\"num\">6,44<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Pill draft<\u002Ftd><td class=\"m\">#545860<\u002Ftd><td class=\"m\">#E9EAEC<\u002Ftd>\n        <td class=\"num\">5,93<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Teks utama dark<\u002Ftd><td class=\"m\">#F4F5F6<\u002Ftd><td class=\"m\">#14161A<\u002Ftd>\n        <td class=\"num\">16,59<\u002Ftd><td><span class=\"ok\">AAA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Teks sekunder dark<\u002Ftd><td class=\"m\">#ADB1B8<\u002Ftd><td class=\"m\">#14161A<\u002Ftd>\n        <td class=\"num\">8,42<\u002Ftd><td><span class=\"ok\">AAA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Brand-300 di surface dark<\u002Ftd><td class=\"m\">#8BA5F0<\u002Ftd><td class=\"m\">#14161A<\u002Ftd>\n        <td class=\"num\">7,54<\u002Ftd><td><span class=\"ok\">AAA<\u002Fspan><\u002Ftd><\u002Ftr><tr>\n        <td>Putih di primer (dark)<\u002Ftd><td class=\"m\">#FFFFFF<\u002Ftd><td class=\"m\">#305CDE<\u002Ftd>\n        <td class=\"num\">5,66<\u002Ftd><td><span class=\"ok\">AA<\u002Fspan><\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable><\u002Fdiv>\n\n  <div class=\"sub\">\n    <h3>Dua keputusan yang lahir dari tabel ini<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>Fill danger memakai 600, bukan 500<\u002Fh4>\n        <div class=\"row\" style=\"gap:10px;margin:10px 0\">\n          <span style=\"padding:10px 14px;border-radius:10px;background:#F33121;color:#fff;font:600 13px/1 var(--pg-font-sans)\">500 · 3,98 ✗<\u002Fspan>\n          <span style=\"padding:10px 14px;border-radius:10px;background:#C62717;color:#fff;font:600 13px/1 var(--pg-font-sans)\">600 · 5,67 ✓<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:13px\">Teks putih di atas <span class=\"m\">#F33121<\u002Fspan> hanya 3,98:1. Karena itu <span class=\"m\">--pg-action-danger<\u002Fspan> menunjuk ke <span class=\"m\">--pg-danger-600<\u002Fspan>. Warna 500 tetap dipakai untuk ikon, border, dan dot.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Accent membawa tinta gelap<\u002Fh4>\n        <div class=\"row\" style=\"gap:10px;margin:10px 0\">\n          <span style=\"padding:10px 14px;border-radius:10px;background:#FF6F00;color:#fff;font:600 13px/1 var(--pg-font-sans)\">putih · 2,79 ✗<\u002Fspan>\n          <span style=\"padding:10px 14px;border-radius:10px;background:#FF6F00;color:#070808;font:600 13px/1 var(--pg-font-sans)\">n-950 · 7,19 ✓<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:13px\">Oranye terlalu terang untuk tinta putih. Sama berlakunya untuk <span class=\"m\">success-500<\u002Fspan> (2,50:1) dan <span class=\"m\">warning-500<\u002Fspan> (12,30:1 dengan tinta gelap).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Selain kontras<\u002Fh3>\n    <ul>\n      <li><strong>Warna bukan satu-satunya pembawa informasi.<\u002Fstrong> Setiap pill status punya dot dan label teks; timeline punya ikon centang/silang.<\u002Fli>\n      <li><strong>Fokus selalu terlihat.<\u002Fstrong> Halo 3px pada semua kontrol; <span class=\"m\">outline: none<\u002Fspan> tanpa pengganti dilarang.<\u002Fli>\n      <li><strong>Target sentuh ≥ 48px<\u002Fstrong> di Android, termasuk baris daftar dan checkbox (seluruh baris menjadi target).<\u002Fli>\n      <li><strong>IconButton wajib <span class=\"m\">label<\u002Fspan><\u002Fstrong> — dipakai sebagai <span class=\"m\">aria-label<\u002Fspan> sekaligus tooltip.<\u002Fli>\n      <li><strong>Teks tersier<\u002Fstrong> (<span class=\"m\">#73777F<\u002Fspan>, 4,49:1) hanya untuk metadata ukuran ≥ 12px; jangan untuk isi penting.<\u002Fli>\n      <li><strong>prefers-reduced-motion<\u002Fstrong> mematikan seluruh animasi dan transisi di level token.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"mobile\">\n  <header><div class=\"eyebrow\">13<\u002Fdiv><h2>Pola layar mobile<\u002Fh2><\u002Fheader>\n  <p>Berlaku untuk aplikasi Customer dan Driver (Android). Keduanya memakai token yang sama; yang berbeda hanya kepadatan isi, sapaan, dan kapan oranye boleh memimpin sebuah aksi.<\u002Fp>\n\n  <div class=\"sub\">\n    <h3>Kerangka layar<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:190px\">Bagian<\u002Fth><th style=\"width:150px\">Ukuran<\u002Fth><th>Aturan<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>App bar<\u002Ftd><td class=\"m\">56px<\u002Ftd><td>Judul sentence case di kiri, maksimal dua icon button di kanan. Di atas peta berubah jadi app bar kaca (<span class=\"m\">--pg-glass-bg<\u002Fspan> + blur).<\u002Ftd><\u002Ftr>\n        <tr><td>Gutter<\u002Ftd><td class=\"m\">20px<\u002Ftd><td>Sama di semua layar mobile. Kartu tidak pernah menempel tepi layar kecuali peta dan foto full-bleed.<\u002Ftd><\u002Ftr>\n        <tr><td>Bottom tab bar<\u002Ftd><td class=\"m\">64px<\u002Ftd><td>Maksimal 5 tab, ikon 20px + label 12px. Ikon tab aktif adalah satu-satunya glyph filled di sistem ini.<\u002Ftd><\u002Ftr>\n        <tr><td>Bottom sheet<\u002Ftd><td class=\"m\">radius 24px<\u002Ftd><td>Grab handle 4×36px, shadow ke atas (<span class=\"m\">--pg-shadow-sheet<\u002Fspan>). Dipakai untuk semua pilihan di atas peta.<\u002Ftd><\u002Ftr>\n        <tr><td>CTA utama<\u002Ftd><td class=\"m\">52px<\u002Ftd><td>Full-bleed dalam gutter, satu per layar, label kata kerja. Ditempel di bawah bila layar menggulir.<\u002Ftd><\u002Ftr>\n        <tr><td>Baris daftar<\u002Ftd><td class=\"m\">min 48px<\u002Ftd><td>Judul 13–14px + baris sekunder 11–12px <span class=\"m\">--pg-text-tertiary<\u002Fspan>, metadata dipisah titik tengah.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Pola yang sudah baku di kit<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>Pemilihan (armada, metode bayar, slot)<\u002Fh4>\n        <p style=\"font-size:13px\">Kartu terpilih memakai <strong>border 2px brand + fill brand-50<\u002Fstrong>, bukan centang sendirian. Kartu yang tidak tersedia tetap terlihat, diberi label alasan, bukan disembunyikan.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Layar peta (tracking, pickup, POD)<\u002Fh4>\n        <p style=\"font-size:13px\">Peta abu-abu teredam; hanya rute, pin, dan dot driver yang jenuh. Kontrol peta melayang di kanan atas sebagai FAB bulat 28px ikon. Informasi order selalu di sheet, tidak pernah melayang bebas di atas peta.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Progres order<\u002Fh4>\n        <p style=\"font-size:13px\">Satu timeline vertikal dengan dot 7px: tahap selesai abu-abu, tahap berjalan brand. Estimasi waktu memakai <span class=\"m\">.pg-tnum<\u002Fspan> supaya angka tidak bergetar saat menghitung mundur.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>Empty state<\u002Fh4>\n        <p style=\"font-size:13px\">Satu kalimat fakta + satu tombol aksi. Ikon 32px netral, tanpa ilustrasi dan tanpa lelucon. Contoh: “Belum ada order aktif.” + “Pesan pengiriman”.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Customer vs Driver<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:170px\">Aspek<\u002Fth><th>Customer<\u002Fth><th>Driver<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Sapaan<\u002Ftd><td>kamu<\u002Ftd><td>Anda<\u002Ftd><\u002Ftr>\n        <tr><td>Kepadatan<\u002Ftd><td>Lapang — satu keputusan per layar<\u002Ftd><td>Padat — status, jarak, dan bayaran terbaca dalam satu pandangan<\u002Ftd><\u002Ftr>\n        <tr><td>Aksen oranye<\u002Ftd><td>Hanya status <em>dalam perjalanan<\u002Fem> dan dot driver di peta<\u002Ftd><td>Boleh memimpin CTA: hitung mundur tawaran order dan tombol “Terima order”<\u002Ftd><\u002Ftr>\n        <tr><td>Angka utama<\u002Ftd><td>Harga dan estimasi tiba<\u002Ftd><td>Pendapatan, jarak, dan sisa waktu SLA<\u002Ftd><\u002Ftr>\n        <tr><td>Konfirmasi merusak<\u002Ftd><td>Menyebut biaya pembatalan<\u002Ftd><td>Menyebut dampak ke performa dan settlement<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"admin\">\n  <header><div class=\"eyebrow\">14<\u002Fdiv><h2>Pola layar admin web<\u002Fh2><\u002Fheader>\n  <p>Admin memakai token yang sama dengan mobile, tetapi kepadatannya jauh lebih tinggi: teks turun ke 12–13px, baris tabel dense, dan setiap layar dirancang untuk dibaca sambil menelepon driver.<\u002Fp>\n\n  <div class=\"sub\">\n    <h3>Shell<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th style=\"width:190px\">Bagian<\u002Fth><th style=\"width:170px\">Ukuran<\u002Fth><th>Aturan<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody>\n        <tr><td>Sidebar<\u002Ftd><td class=\"m\">248px / 68px<\u002Ftd><td>Bisa diciutkan lewat icon button <span class=\"m\">panel-left-close<\u002Fspan> di ujung kiri topbar. Saat ciut: label grup dan badge hilang, ikon terpusat, footer menyisakan avatar. Transisi lebar 220ms.<\u002Ftd><\u002Ftr>\n        <tr><td>Grup nav<\u002Ftd><td>3 grup<\u002Ftd><td>Operasional · Master data · Pengguna &amp; keuangan. Badge angka hanya untuk antrean yang butuh tindakan (dispatch, SLA).<\u002Ftd><\u002Ftr>\n        <tr><td>Topbar<\u002Ftd><td class=\"m\">64px<\u002Ftd><td>Breadcrumb (opsional) di atas judul, subjudul satu baris berisi angka konteks, search 280px, lonceng, lalu aksi utama layar.<\u002Ftd><\u002Ftr>\n        <tr><td>Konten<\u002Ftd><td class=\"m\">max 1440px<\u002Ftd><td>Gutter 24px, jarak antar seksi 16px, kartu 16–20px padding.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Empat pola halaman<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h4>1 · List + detail <span class=\"m\">1,5fr / 1fr<\u002Fspan><\u002Fh4>\n        <p style=\"font-size:13px\">FilterBar → DataTable → Pagination di kiri; panel detail sticky di kanan berisi header identitas, tiga angka ringkas, KeyValueRow, lalu tumpukan tombol aksi. Dipakai di SLA, driver, customer, transaksi, settlement, invoice.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>2 · Master 300px + detail<\u002Fh4>\n        <p style=\"font-size:13px\">Daftar entitas di kiri (baris terpilih: fill brand-50 + garis brand 2px di tepi kiri), seluruh pengaturan di kanan. Dipakai di area &amp; geofence, armada, pricing.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>3 · Form + simulator<\u002Fh4>\n        <p style=\"font-size:13px\">Form konfigurasi di kiri, kartu simulasi sticky di kanan yang memperlihatkan akibat perubahan secara langsung (tarif, radius eskalasi). Perubahan belum berlaku sampai “Simpan perubahan”.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <h4>4 · Dashboard infografis<\u002Fh4>\n        <p style=\"font-size:13px\">Baris 5 MetricCard, lalu grafik dari besar ke kecil, tabel antrean terakhir. Semua grafik memakai elemen DOM ber-token — tidak ada library chart dan tidak ada SVG gambar tangan.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Aturan tabel<\u002Fh3>\n    <ul>\n      <li><strong>Maksimal 6 kolom<\u002Fstrong> di slot <span class=\"m\">1,5fr<\u002Fspan>; tabel tidak boleh menggulir horizontal di dalam kartu.<\u002Fli>\n      <li>Kolom identitas menggabung dua baris: <strong>ID mono<\u002Fstrong> di atas, waktu/periode <span class=\"m\">--pg-text-tertiary<\u002Fspan> di bawah — bukan kolom terpisah.<\u002Fli>\n      <li><strong>Status selalu kolom terakhir<\u002Fstrong> dan selalu pill. Kolom angka rata kanan dengan <span class=\"m\">.pg-tnum<\u002Fspan>.<\u002Fli>\n      <li>Angka yang melewati ambang berubah warna ke <span class=\"m\">--pg-text-danger<\u002Fspan>, tidak pernah diberi latar merah penuh.<\u002Fli>\n      <li>Baris bisa diklik menuju detail; aksi baris hanya icon button ghost di ujung kanan.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"margin-top:22px\">Aturan infografis<\u002Fh3>\n    <div class=\"grid2\">\n      <div class=\"do\">\n        <h4>Lakukan<\u002Fh4>\n        <ul style=\"margin-top:8px\">\n          <li>Satu seri = brand, seri pembanding = accent. Lebih dari dua seri: pakai skala brand 100→600.<\u002Fli>\n          <li>Donut memakai <span class=\"m\">conic-gradient<\u002Fspan> dari warna status (<span class=\"m\">--pg-state-*-fg<\u002Fspan>) dengan angka ringkas di tengah.<\u002Fli>\n          <li>Heatmap memakai 5 langkah brand; angka di sel gelap putih, di sel terang <span class=\"m\">--pg-text-primary<\u002Fspan>.<\u002Fli>\n          <li>Setiap grafik punya satu kalimat kesimpulan atau legenda — tidak dibiarkan ditafsirkan sendiri.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dont\">\n        <h4>Jangan<\u002Fh4>\n        <ul style=\"margin-top:8px\">\n          <li>Warna status untuk data yang bukan status order.<\u002Fli>\n          <li>Gradien dekoratif, bayangan 3D, atau grafik pai lebih dari 5 irisan.<\u002Fli>\n          <li>Teks di bawah 11px pada label sumbu, atau angka tanpa <span class=\"m\">.pg-tnum<\u002Fspan>.<\u002Fli>\n          <li>Skala sumbu yang dipotong sehingga selisih kecil terlihat besar.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 style=\"margin-top:22px\">Dialog &amp; override<\u002Fh3>\n    <ul>\n      <li>Setiap tindakan merusak (suspend driver, blokir akun, tutup exception, refund) <strong>menyebutkan akibatnya dengan angka<\u002Fstrong> di deskripsi dialog.<\u002Fli>\n      <li>Setiap override operasional menyediakan field <strong>Alasan<\u002Fstrong> dan alasan itu tercatat di riwayat entitas.<\u002Fli>\n      <li>Tombol merusak memakai varian danger dan berada di kanan; “Batal” selalu secondary di kirinya.<\u002Fli>\n      <li>Batch keuangan menyebut jumlah penerima dan total nominal, serta menyatakan bahwa langkah itu tidak bisa dibatalkan.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"token\">\n  <header><div class=\"eyebrow\">15<\u002Fdiv><h2>Lampiran: token semantik<\u002Fh2><\u002Fheader>\n  <p>Daftar alias yang <strong>boleh dipakai langsung oleh komponen<\u002Fstrong>. Ramp mentah (<span class=\"m\">--pg-brand-500<\u002Fspan> dan kawan-kawan) hanya untuk mendefinisikan alias ini, bukan untuk dipanggil dari komponen.<\u002Fp>\n\n  \n  <div class=\"sub\">\n    <h3>Latar<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th class=\"m\" style=\"width:250px\">Token<\u002Fth><th class=\"m\" style=\"width:150px\">Light<\u002Fth><th class=\"m\" style=\"width:180px\">Dark<\u002Fth><th>Dipakai untuk<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody><tr>\n ock;width:11px;height:11px;border-radius:3px;background:#0B0C0E;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#0B0C0E<\u002Ftd>\n        <td>Track bar, chip netral<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-bg-inset<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#FAFAFB;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#FAFAFB<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#101215;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#101215<\u002Ftd>\n        <td>Panel bersarang, header tabel<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-bg-scrim<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:rgba(7,8,8,.48);border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>rgba(7,8,8,.48)<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>rgba(0,0,0,.62)<\u002Ftd>\n        <td>Scrim modal<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-bg-brand-soft<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#EDF1FD;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#EDF1FD<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:rgba(48,92,222,.18);border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>rgba(48,92,222,.18)<\u002Ftd>\n        <td>Nav aktif, pill assigned<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-bg-accent-soft<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#FFF2E6;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#FFF2E6<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:rgba(255,111,0,.16);border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>rgba(255,111,0,.16)<\u002Ftd>\n        <td>Badge insentif, pill transit<\u002Ftd><\u002Ftr><\u002Ftbody>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sub\">\n    <h3>Teks<\u002Fh3>\n    <div class=\"tw\"><table>\n      <thead><tr><th class=\"m\" style=\"width:250px\">Token<\u002Fth><th class=\"m\" style=\"width:150px\">Light<\u002Fth><th class=\"m\" style=\"width:180px\">Dark<\u002Fth><th>Dipakai untuk<\u002Fth><\u002Ftr><\u002Fthead>\n      <tbody><tr>\n        <td class=\"m\">--pg-text-primary<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#070808;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#070808<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#F4F5F6;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#F4F5F6<\u002Ftd>\n        <td>Isi utama<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-text-secondary<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#545860;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#545860<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#ADB1B8;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#ADB1B8<\u002Ftd>\n        <td>Penjelasan, label baris<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-text-tertiary<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#73777F;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#73777F<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#82868E;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#82868E<\u002Ftd>\n        <td>Metadata, timestamp<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-text-disabled<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#9A9DA6;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#9A9DA6<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#5C6067;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#5C6067<\u002Ftd>\n        <td>Kontrol nonaktif<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-text-brand<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#2449BC;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#2449BC<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#8BA5F0;border:1px solid rgba(255,255,255,.16);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#8BA5F0<\u002Ftd>\n        <td>Teks &amp; ikon brand<\u002Ftd><\u002Ftr><tr>\n        <td class=\"m\">--pg-text-accent<\u002Ftd>\n        <td class=\"m\"><span style=\"display:inline-block;width:11px;height:11px;border-radius:3px;background:#A84900;border:1px solid rgba(7,8,8,.12);margin-right:6px;vertical-align:-1px\"><\u002Fspan>#A84900<
